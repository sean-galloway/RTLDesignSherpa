# SPDX-License-Identifier: MIT
# peregrine riscv-formal ISA proofs -- genchecks configuration, MUL_DSP=1
# (riscv-ip/peregrine-rv32im TASK-001 stage 5, PRD P12).  The same suite as
# checks.cfg on the DSP multiply build: a multiply holds EX 2 cycles, not
# 33, so its insn checks run shallower and the consistency checks see
# multiply results forwarded and read back.  Divide is iterative in both.
#
# RV32IM insn checks for every instruction riscv-formal models, plus reg,
# pc_fwd, pc_bwd, causal, liveness and unique, on peregrine_core with
# CACHE_EN=0, BP_EN=1 and the interrupt lines tied low (formal_peregrine.sv).
#
# RISCV_FORMAL_ALIGNED_MEM: peregrine traps a misaligned load/store and
# reports memory as the word address with lane masks (merlin's convention).
# RISCV_FORMAL_ALTOPS: the M unit returns riscv-formal's stand-in results
# (peregrine_mdu, same define at sv2v time) with its real timing; the real
# arithmetic is simulation's (test_peregrine_mdu, rv32um, arch-test M).
#
# Depths (TASK-001 stage 5 has the measurements):
# - insn 15: every instruction can retire by then; riscv-formal ERRORs
#   (PREUNSAT) if the checked instruction cannot retire at that cycle, so
#   the depth is never vacuous.
# - insn for an iterative multiply, 45: the earliest a 33-cycle multiply
#   retires is cycle 41 or 42 (unsatisfiable at 40, a mutant fails at 42).
# - divide and remainder stay at 15: they retire there only through the
#   early-outs (divide by zero, -2^31 / -1).  At 45 the early-out lets ~40
#   cycles of arbitrary history precede the checked divide and no check
#   finished in 50 minutes; the full 32-step path uses the same busy /
#   count / done / consume control the multiplies prove at 45, and its
#   arithmetic is formal/peregrine/mdu_ref's (owner 2026-11-25: "Depth 15,
#   documented").
# - reg 16: 4 s at 12, 56 s at 16, over 15 minutes at 20 (merlin runs 10).
# - pc_fwd / pc_bwd / causal 20; liveness triggers at 10 and must see the
#   next retire by 60, past a 33-cycle M hold under waits; unique 10 / 30.
# causal can only fail with more than one retire channel; it runs because
# it is cheap, not because it says anything here.

[options]
isa rv32im
solver bitwuzla

[defines]
`define RISCV_FORMAL_ALIGNED_MEM
`define RISCV_FORMAL_ALTOPS
`define PEREGRINE_MUL_DSP

[depth]
insn       15
reg        4  16
pc_fwd     4  20
pc_bwd     4  20
causal     4  20
liveness   1  10 60
unique     1  10 30
ill        15

[script-sources]
read_verilog -sv -I@basedir@/checks @basedir@/peregrine/riscv-formal/formal_peregrine.sv
read_verilog @basedir@/peregrine/riscv-formal/peregrine_flat.v
