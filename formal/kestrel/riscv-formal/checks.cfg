# SPDX-License-Identifier: MIT
# kestrel riscv-formal ISA proofs — genchecks configuration.
#
# RV32I insn checks for every base instruction kestrel implements, plus the
# pc_fwd / pc_bwd / reg / liveness / unique consistency checks.  Depths: insn
# and consistency checks at core depth 6 (spans a 2-cycle cross-word
# misaligned access plus reset — cheap with z3); liveness/unique use a deeper
# 30-cycle window per the picorv32 reference config.
#
# kestrel reports unaligned access addresses with packed strobes and data at
# bit 0 (per rvfi.md), which is the riscv-formal convention when
# RISCV_FORMAL_ALIGNED_MEM is NOT defined — so it is deliberately absent
# here.  RISCV_FORMAL_ALTOPS is likewise absent (no M extension).
#
# There is no `mem`/`dmem` consistency check in this pinned genchecks.py; load
# and store semantics are verified by the insn_* models plus reg.
#
# Tool-note: this oss-cad-suite yosys (0.62+95) has no `const rand reg`
# keyword support (parse error at rvfi_reg_check.sv:19 and friends), while
# `rand reg` and `(* anyconst *) reg` are native with identical
# anyseq/anyconst semantics.  The Makefile therefore builds this area's
# formal/checks harness directory as a symlink farm around a sed-patched COPY
# of rvfi_macros.vh; the vendor tree is never modified.

[options]
isa rv32i
solver z3

[depth]
insn       6
reg        2  6
pc_fwd     2  6
pc_bwd     2  6
liveness   1  6 30
unique     1  6 30

[script-sources]
read_verilog -sv -I@basedir@/checks @basedir@/kestrel/riscv-formal/formal_kestrel.sv
read_verilog @basedir@/kestrel/riscv-formal/checks/rtl_v/kestrel_regfile.v
read_verilog @basedir@/kestrel/riscv-formal/checks/rtl_v/kestrel_alu.v
read_verilog @basedir@/kestrel/riscv-formal/checks/rtl_v/kestrel_imm_gen.v
read_verilog @basedir@/kestrel/riscv-formal/checks/rtl_v/kestrel_decode.v
read_verilog @basedir@/kestrel/riscv-formal/checks/rtl_v/kestrel_core.v
