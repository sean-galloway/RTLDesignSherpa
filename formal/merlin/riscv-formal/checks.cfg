# SPDX-License-Identifier: MIT
# merlin riscv-formal ISA proofs — genchecks configuration.
#
# RV32I insn checks for every base instruction merlin implements, plus the
# pc_fwd / pc_bwd / reg / liveness / unique consistency checks.
#
# merlin is a 5-stage pipeline with a 3-cycle boundary reset synchronizer, so
# the first instruction retires at cycle 7 (1 external reset + 3 sync + 4
# pipeline stages).  insn/consistency checks therefore start no earlier than
# cycle 4 (after reset_sync releases) and check at cycle 10, giving a few
# retirements including at least one under the bounded mem_wait.  liveness/
# unique trigger at cycle 8 (first valid retire window) and check to cycle 30.
#
# RISCV_FORMAL_ALIGNED_MEM (2026-10-20): merlin traps (halts on) a
# misaligned load/store and reports memory as the word address with lane
# masks and lane-positioned data -- the convention picorv32 and serv use.
# The insn models then require rvfi_trap on every misaligned access.
# RISCV_FORMAL_ALTOPS is absent (no M extension).
#
# Solver bitwuzla (2026-10-20): once the register file lost its reset (an
# unconstrained initial array), z3 had not finished `liveness` after 30
# minutes; bitwuzla proves all 42 in about 3 s (liveness to step 30).  Not
# vacuous: dropping ~mem_wait from the register write gate fails `reg`.
#
# There is no `mem`/`dmem` consistency check in this pinned genchecks.py; load
# and store semantics are verified by the insn_* models plus reg.
#
# Tool-note: this oss-cad-suite yosys (0.62+95) has no `const rand reg`
# keyword support (parse error at rvfi_reg_check.sv:19 and friends), while
# `rand reg` and `(* anyconst *) reg` are native with identical
# anyseq/anyconst semantics.  The Makefile therefore builds this area's
# formal/checks harness directory as a symlink farm around a sed-patched COPY
# of rvfi_macros.vh; the vendor tree is never modified.

[options]
isa rv32i
solver bitwuzla

[defines]
`define RISCV_FORMAL_ALIGNED_MEM

[depth]
insn       10
reg        4  10
pc_fwd     4  10
pc_bwd     4  10
liveness   1  8  30
unique     1  8  30

[script-sources]
read_verilog -sv -I@basedir@/checks @basedir@/merlin/riscv-formal/formal_merlin.sv
read_verilog @basedir@/merlin/riscv-formal/merlin_flat.v
