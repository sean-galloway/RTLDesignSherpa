# SPDX-License-Identifier: MIT
# gatling riscv-formal ISA proofs — genchecks configuration.
#
# The same check set as formal/kestrel/riscv-formal (gatling's ISA contract
# is kestrel's): RV32I insn checks for every base instruction, plus pc_fwd /
# pc_bwd / reg / liveness / unique.  The wrapper (formal_gatling.sv) observes
# context 0 and leaves contexts 1-3 free -- their instructions, load data and
# run bits are arbitrary every cycle -- so reg and pc_* also prove the other
# contexts cannot disturb context 0.
#
# Depths.  Context 0 retires once per four cycles, on a fixed phase after the
# one-cycle reset, and an insn check fires at exactly cycle `insn` assuming a
# retirement there.  Off that phase the assumption is unsatisfiable: sby
# reports PREUNSAT (ERROR), not a vacuous PASS -- measured at depths 9, 10,
# 12 and 13.  Depth 11 is the phase: with an ADD bug planted, insn_add and
# insn_addi FAIL there (2026-10-21).  The consistency checks assume a
# retirement at their check/trigger cycles too, so those sit on the same
# phase (cycle = 3 mod 4: 7, 23, 59), about four times kestrel's windows.
#
# RISCV_FORMAL_ALIGNED_MEM: as kestrel (misaligned loads/stores halt, memory
# reported as word address + lane masks).  Solver bitwuzla: as kestrel (the
# register file has no reset; bitwuzla handles the unconstrained array).

[options]
isa rv32i
solver bitwuzla

[defines]
`define RISCV_FORMAL_ALIGNED_MEM

[depth]
insn       11
reg        7  23
pc_fwd     7  23
pc_bwd     7  23
liveness   3  23 59
unique     3  23 59

[script-sources]
read_verilog -sv -I@basedir@/checks @basedir@/gatling/riscv-formal/formal_gatling.sv
read_verilog @basedir@/gatling/riscv-formal/gatling_flat.v
