name: Filelist checks

# The compile-closure contract, enforced. Before this existed nothing ran these
# checks in a hook or in CI, so the rule was kept by whoever remembered -- which
# is how rtl/cdc went unregistered, three tests stayed broken behind a green
# --check, and four formal harnesses lost a whole dependency tree.
#
# --check and --audit are HARD gates: they pass today and must keep passing.
# --blindspots is RATCHETED against bin/blindspots_baseline.json: it has a real
# backlog (see tooling TASK-011 (was TOOL-012)), so it fails only when a count GROWS. A new hand-listed
# test breaks the build immediately; the existing ones block nobody.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  filelists:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 3.11+ for tomllib in the stdlib -- the checker needs no pip install,
      # so this job stays fast and cannot drift from a requirements file.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Every module is reachable from some filelist
        run: python3 bin/filelist_registry.py --check

      - name: No filelist hand-lists another area's sources
        run: python3 bin/filelist_registry.py --audit

      - name: No NEW blind spots (unregistered .f, hand-listed test, dead .sby path)
        run: python3 bin/filelist_registry.py --blindspots --ratchet

      - name: No NEW filelist outside a filelists/ dir
        run: python3 bin/filelist_registry.py --placement

      - name: No doc example names a port the module lacks
        run: python3 bin/check_doc_examples.py

      - name: No test elaborates another protocol family's RTL
        run: python3 bin/check_test_dut_family.py

      # Same rule make lint enforces for the harness flows (fpga_flow.mk's
      # lint-decl-order): a signal used before its declaration silently becomes
      # an implicit 1-bit net, which synthesizes as a single wire and only
      # blows up in Vivado or on the board. Scoped to hand-written sources:
      # packages and generated regblocks/bridges are excluded (packages
      # declare-and-use inside a compilation unit; generated code is the
      # generator's contract, checked at generation time).
      - name: Signals declared before use (no implicit 1-bit nets)
        run: |
          git ls-files 'rtl/*.sv' 'rtl/**/*.sv' 'projects/components/*/rtl/**/*.sv' \
          | grep -v '_pkg\.sv$' | grep -v '/generated/' \
          | xargs python3 bin/check_sv_decl_order.py

      - name: No NEW broken markdown link
        run: python3 bin/check_broken_links.py --ratchet

      # tooling TASK-015. Until 2026-09-29 this ran only in the local pre-commit
      # hook, so a --no-verify commit or a checkout with no hooks installed
      # could land an INDEX saying `closed: 15` beside a file still in open/,
      # with nothing downstream to catch it. Stdlib only, same as the rest of
      # this job. Its teeth are proven in the board-layer job below.
      - name: Task tracker agrees with disk (counts, listings, Next ID, filename==H1)
        run: python3 bin/check_task_ids.py

      - name: Show the outstanding backlog
        if: always()
        run: python3 bin/filelist_registry.py --blindspots || true

      - name: Show the outstanding broken links
        if: always()
        run: python3 bin/check_broken_links.py --list || true

  # Its own job because it is the only check that needs the PeakRDL toolchain
  # installed -- the filelist job above is deliberately pip-free, and adding
  # this there would break it on a missing import (peakrdl_html is imported
  # unconditionally by the generator even when --no-html is passed).
  #
  # Versions come from requirements.txt so CI cannot silently regenerate with a
  # different PeakRDL than the tree was generated with -- that would report
  # every artifact stale and block everyone.
  rdl-regen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install the pinned PeakRDL toolchain
        run: |
          python3 -m pip install --quiet \
            peakrdl==1.5.0 \
            peakrdl-regblock==1.1.1 \
            peakrdl-html==2.11.0 \
            peakrdl_markdown==1.0.3

      - name: A .rdl edit has not left its generated artifacts stale
        run: python3 bin/check_rdl_regen.py

  # tooling TASK-026. A committed *_flat.v is a snapshot: a source change with
  # no re-flatten leaves the proof checking the old design, silently and green
  # (rapids BUG-011 shipped that way twice; the 2026-09 audit found 36 of 48
  # flats stale repo-wide). The pre-commit gate only sees what one commit
  # touches, so this job runs the repo-wide sweep on every push. Fails on any
  # STALE or UNHANDLED proof; the report is uploaded either way.
  flat-staleness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # Pinned to the version the dev machine flattens with (/mnt/data/tools,
      # v0.0.13) so CI cannot disagree with local regeneration.
      - name: Install sv2v v0.0.13
        run: |
          curl -sSL -o /tmp/sv2v.zip \
            https://github.com/zachjs/sv2v/releases/download/v0.0.13/sv2v-Linux.zip
          unzip -o /tmp/sv2v.zip -d /tmp/sv2v
          # The upstream zip nests the binary under sv2v-Linux/ (layout
          # changed 2026-10-04); locate it wherever the zip puts it.
          SV2V_DIR="$(dirname "$(find /tmp/sv2v -type f -name sv2v | head -n1)")"
          chmod +x "$SV2V_DIR/sv2v"
          echo "$SV2V_DIR" >> "$GITHUB_PATH"

      - name: Every committed formal flat matches its sources
        run: python3 bin/formal_status.py --check-flats --json flat_report.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flat-report
          path: flat_report.json

  # Separate job so the filelist job above stays pip-free and fast. These tests
  # cover the logic whose failure is SILENT on hardware -- a wrong port or a
  # skipped init reads as a timing bug, not a lookup bug. Three of them were red
  # for weeks (a board swap changed the registry serial) and nobody saw it,
  # because nothing ran them. That is what this job exists to prevent.
  board-layer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # pytest only; the tests are deliberately board-less and import
      # pyserial lazily, so no hardware and no serial stack is needed.
      - name: Install pytest
        run: python3 -m pip install --quiet pytest

      # The interrupt-BFM decomposition tests moved with the BFM itself into
      # RTLDesignSherpa-DV (consumed here as cocotb-framework 1.0.0); they now
      # run in that repo's unit-tests job as tests/unit/test_irq_logic.py, so
      # the "nothing ran them" protection lives there, not here.
      - name: Board selection and sequence ordering (board-less)
        run: python3 -m pytest projects/fpga-systems/bin/ -q

      # RLB TASK-018. The per-IR-line verdict's value is entirely in FAILING:
      # its fail-closed branch is one line, and if that regressed to True all
      # seven rlb_top fabric tests would still report PASSED while asserting
      # nothing. Nothing else in CI runs the RLB area, so without this step the
      # check is unprotected. Imports only the extracted pure module -- no
      # cocotb, no TB, no DUT.
      - name: rlb_top per-IR-line verdict (simulator-free)
        run: python3 -m pytest projects/components/retro_legacy_blocks/dv/tbclasses/rlb_top/tests/ -q

      # tooling TASK-015 criterion 3: the tracker gate above must FAIL on a
      # wrong count, an unlisted item, a stale Next ID and a filename/H1
      # mismatch -- not merely run. Each case is a scratch lane mutated one
      # way. Only this file: bin/tests/ also holds a check_port_consumers test
      # that needs verilator, which this job does not install.
      - name: Task-tracker checker has teeth (fails on each planted defect)
        run: python3 -m pytest bin/tests/test_check_task_ids.py -q

      # tooling TASK-026 criterion 3: the flat gate above must FAIL on a
      # planted-stale flat, not merely run. Same pinned sv2v as the
      # flat-staleness job; the tests build their own scratch proof repo.
      - name: Install sv2v v0.0.13
        run: |
          curl -sSL -o /tmp/sv2v.zip \
            https://github.com/zachjs/sv2v/releases/download/v0.0.13/sv2v-Linux.zip
          unzip -o /tmp/sv2v.zip -d /tmp/sv2v
          # The upstream zip nests the binary under sv2v-Linux/ (layout
          # changed 2026-10-04); locate it wherever the zip puts it.
          SV2V_DIR="$(dirname "$(find /tmp/sv2v -type f -name sv2v | head -n1)")"
          chmod +x "$SV2V_DIR/sv2v"
          echo "$SV2V_DIR" >> "$GITHUB_PATH"

      - name: Flat staleness checker has teeth (planted drift, current flat, side-effect recipe)
        run: python3 -m pytest bin/tests/test_formal_status.py -q
