name: apps pages

# Test-then-deploy for the RTLDesignSherpa static app site. Stages a site
# directory: the root launcher (bin/apps/launcher) at /, and each app at its
# tile href (ddr_drills at /ddr_drills/, fifo_depth at /fifo/, the seven
# RTL-drills apps at /<dir>/). Every app's node suite gates the deploy: the
# suites require() the same js bytes the browsers load, so a green test job
# means the deploy cannot publish broken math or a malformed pack.
#
# ONE-TIME MANUAL STEP (done): repo Settings -> Pages -> Source = "GitHub
# Actions". No gh-pages branch is used; the artifact is uploaded directly.

on:
  push:
    branches: [main]
    paths:
      - 'bin/apps/**'
      - '.github/workflows/pages-ddr-drills.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 20 for deterministic Math/DOM-free behavior; the suites are
      # zero-dependency, so this job stays fast.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: ddr_drills engine, scenario, timing and pack suites
        run: node bin/apps/ddr_drills/test/run_tests.js

      - name: fifo_depth model, validation and golden-case suites
        run: node bin/apps/fifo_depth/test/run_tests.js

      - name: launcher site-integrity suite
        run: node bin/apps/launcher/test/run_tests.js

      - name: mtbf_calc suite
        run: node bin/apps/mtbf_calc/test/run_tests.js

      - name: fifo_flags suite
        run: node bin/apps/fifo_flags/test/run_tests.js

      - name: slack_explorer suite
        run: node bin/apps/slack_explorer/test/run_tests.js

      - name: qformat_explorer suite
        run: node bin/apps/qformat_explorer/test/run_tests.js

      - name: cdc_drill suite
        run: node bin/apps/cdc_drill/test/run_tests.js

      - name: crc_calc suite
        run: node bin/apps/crc_calc/test/run_tests.js

      - name: cache_sim suite
        run: node bin/apps/cache_sim/test/run_tests.js

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5

      - name: Stage site directory
        run: |
          mkdir -p _site
          cp -r bin/apps/launcher/* _site/
          mkdir -p _site/ddr_drills _site/fifo _site/mtbf_calc \
                   _site/fifo_flags _site/slack_explorer _site/qformat_explorer \
                   _site/cdc_drill _site/crc_calc _site/cache_sim
          cp -r bin/apps/ddr_drills/* _site/ddr_drills/
          cp -r bin/apps/fifo_depth/* _site/fifo/
          cp -r bin/apps/mtbf_calc/* _site/mtbf_calc/
          cp -r bin/apps/fifo_flags/* _site/fifo_flags/
          cp -r bin/apps/slack_explorer/* _site/slack_explorer/
          cp -r bin/apps/qformat_explorer/* _site/qformat_explorer/
          cp -r bin/apps/cdc_drill/* _site/cdc_drill/
          cp -r bin/apps/crc_calc/* _site/crc_calc/
          cp -r bin/apps/cache_sim/* _site/cache_sim/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

