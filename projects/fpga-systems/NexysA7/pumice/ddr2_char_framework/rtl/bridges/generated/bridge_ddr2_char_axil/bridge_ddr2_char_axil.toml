#==============================================================================
# bridge_ddr2_char_axil.toml
#==============================================================================
# 1-master x 5-slave AXI4-Lite/APB bridge for the ddr2-characterization
# harness. Sibling of stream_characterization's bridge_stream_char_axil,
# stripped to what the DDR2 bring-up flow actually needs.
#
# The single master is the host's UART -> AXIL bridge. The five slaves:
#
#   ddr2_apb       0x00000000  4 KB    APB    pumice controller CSR slave
#                                              (mode-registers, init sequence,
#                                              runtime perf counters — inside
#                                              the char macro)
#   harness_csr    0x00010000  4 KB    AXIL   Harness ctrl + timer + response
#                                              delay + engine cfg + perf
#                                              readback (see harness_csr.sv
#                                              register map).
#   debug_sram     0x00040000  256 KB  AXIL   MonBus / DFI trace capture ring.
#                                              64-bit end-to-end so a single
#                                              DFI cmd packet fits in one beat.
#   dfi_mon_ram    0x00080000  4 KB    AXIL   Small AXIL ring for DFI cmd-only
#                                              observability (host-polled).
#                                              Sits at 0x80000 so it doesn't
#                                              overlap the 256-KB debug_sram
#                                              window (0x40000-0x7FFFF).
#   obs_apb        0x00090000  4 KB    APB    EXPANSION SLOT. Sized and typed
#                                              for axi4_intf_master_observer's
#                                              obs_regs block, whose slave port
#                                              is APB with a 12-bit PADDR — so
#                                              4 KB is exactly its window.
#                                              Added 2026-08-28 so adopting the
#                                              observer ([[PUMICE-016]]) is an
#                                              instantiation rather than a
#                                              bridge regen on the DDR2
#                                              critical path.
#                                              UNTIL THEN THE HARNESS MUST TIE
#                                              IT OFF (PREADY=1, PRDATA=0,
#                                              PSLVERR=0) or a stray access to
#                                              0x90000 hangs the host bus.
#
#   chargen_apb    0x000A0000  4 KB    APB    Traffic-generator config
#                                              (chargen_regs, generated from
#                                              ddr2_char_framework/rtl/
#                                              chargen_regs.rdl). Sixteen
#                                              per-bank pattern generators --
#                                              eight write, eight read -- each
#                                              with an eleven-register config
#                                              plus status, on a 0x40 stride,
#                                              and a shared GO register that
#                                              launches any subset on one cycle.
#                                              Occupies 0x000..0x417, so 4 KB is
#                                              the window with room to grow.
#
#                                              SEPARATE FROM harness_csr on
#                                              purpose: harness_csr describes the
#                                              BOARD and is hand-written for its
#                                              pulses and PHY indirection; this
#                                              describes the WORKLOAD and is pure
#                                              array, so it is generated. Folding
#                                              sixteen generators into
#                                              harness_csr would triple its
#                                              register count with state the
#                                              harness never reads.
#
# NB: desc_ram was in the original 1x5 layout as a placeholder for a
# future dma_address_gen path. Removed because the pattern-gen engines
# (axi4_master_wr_pattern_gen + axi4_master_rd_crc_check) have their own
# strided address generator driven directly from harness_csr cfg regs
# at 0x100 / 0x180 — no descriptor RAM needed. If we later want a
# scripted / trace-replay workload class the pattern-gen engines can't
# express, add a new slave then.
#
# Generated outputs land in ddr2_char_framework/rtl/bridges/generated/
# bridge_ddr2_char_axil/.
#
# THIS IS THE ONLY BRIDGE IN THIS DESIGN, and deliberately so. Two data-path
# bridges (bridge_ddr2_char_wr / bridge_ddr2_char_rd, 2x1 AXI4) used to sit
# between the generators and pumice's s_axi; char_gen_unit replaced them and
# the generators now drive s_axi DIRECTLY. Their configs, filelists and
# generated output were removed 2026-09-24 -- they had been dead since the
# replacement and were actively misleading: they described a 2-master-per-
# direction array with a long rationale for why 2 was the right rung, while the
# built array reports 4 wr + 4 rd.
#
# The rule that leaves: generator AXI goes straight to the controller; only the
# APB config ports come through a bridge. A bridge is the right tool for a real
# address decode across unrelated slaves, which is what this file describes. It
# is the wrong tool for N identical masters merging onto one slave at one
# address range -- there it is a measuring instrument that caps what it
# measures (each generated adapter gated the address channel on a bridge_cam
# with DEPTH(16), so the engine could never exceed 16 outstanding whatever the
# generators were programmed for).
#==============================================================================

[bridge]
name = "bridge_ddr2_char_axil"
description = "1xM AXIL bridge for ddr2-characterization harness (APB CSR + harness_csr + debug_sram + dfi_mon_ram + obs_apb expansion slot)"
# Only the "no" variant for bring-up — the mon variant is available as
# a follow-up if the DFI observability path needs per-adapter monitors.
variants = ["no"]
mon_preset = "all"

[bridge.clock]
name = "aclk"
frequency_mhz = 100

# ---- Master ----------------------------------------------------------------
[[bridge.masters]]
name        = "host"
# `host_axi_` matches the wiring convention carried over from
# stream_characterization — the harness wires the bridge with
# `.host_axi_<sig>(...)` connections.
prefix      = "host_axi_"
protocol    = "axil"
channels    = "rw"
# 0 because AXI4-Lite has no transaction IDs, and the generator's validator
# now enforces that. This said 8 ("mirrors stream", for uniform xbar id
# routing) and the generated wrapper simply tied those eight bits to zero and
# left the returning ones open -- they never reached the bridge's external
# port list, so nothing outside ever connected them. Carrying a width for a
# field the protocol does not have bought nothing and blocked every build once
# the validator caught up.
id_width    = 0
addr_width  = 32
data_width  = 32
user_width  = 0

# ---- Slaves ----------------------------------------------------------------
[[bridge.slaves]]
name        = "ddr2_apb"
# APB port on the pumice controller (`s_apb_P<sig>` in the core).
# The generated bridge slave adapter converts AXIL 32b to APB 32b.
prefix      = "ddr2_apb_"
protocol    = "apb"
channels    = "rw"
id_width    = 0       # APB has no IDs; validator forces this to 0
addr_width  = 32
data_width  = 32
user_width  = 0
base_addr   = "0x00000000"
addr_range  = "0x00001000"     # 4 KB

[[bridge.slaves]]
name        = "harness_csr"
prefix      = "harness_csr_axi_"
protocol    = "axil"
channels    = "rw"
id_width    = 8
addr_width  = 32
data_width  = 32
user_width  = 0
base_addr   = "0x00010000"
# harness_csr uses 0x000-0x1FF today, but the decode window has to be
# page-granular so we reserve a full 4 KB slot.
addr_range  = "0x00001000"     # 4 KB

[[bridge.slaves]]
name        = "debug_sram"
prefix      = "debug_sram_axi_"
protocol    = "axil"
channels    = "rw"
id_width    = 8
addr_width  = 32
# 64-bit end-to-end — matches stream's debug_sram sizing so we can
# reuse axil_sdpram_slave in the harness without rewriting. Bridge
# does the 32->64 upsize on the host write path.
data_width  = 64
user_width  = 0
base_addr   = "0x00040000"
addr_range  = "0x00040000"     # 256 KB

[[bridge.slaves]]
name        = "dfi_mon_ram"
prefix      = "dfi_mon_ram_axi_"
protocol    = "axil"
channels    = "rw"
id_width    = 8
addr_width  = 32
data_width  = 32
user_width  = 0
base_addr   = "0x00080000"
addr_range  = "0x00001000"     # 4 KB

[[bridge.slaves]]
name        = "obs_apb"
# EXPANSION SLOT -- see the header. Typed APB/4 KB to match
# axi4_intf_master_observer's obs_regs slave (12-bit PADDR) so the observer
# can be dropped in without touching this file or regenerating the bridge.
prefix      = "obs_apb_"
protocol    = "apb"
channels    = "rw"
id_width    = 0       # APB has no IDs; validator forces this to 0
addr_width  = 32
data_width  = 32
user_width  = 0
base_addr   = "0x00090000"
addr_range  = "0x00001000"     # 4 KB

[[bridge.slaves]]
name        = "chargen_apb"
# The generated chargen_regs block behind the harness's apb4_to_peakrdl shim.
# APB/4 KB like obs_apb -- same shape, same reason.
prefix      = "chargen_apb_"
protocol    = "apb"
channels    = "rw"
id_width    = 0       # APB has no IDs; validator forces this to 0
addr_width  = 32
data_width  = 32
user_width  = 0
base_addr   = "0x000A0000"
addr_range  = "0x00001000"     # 4 KB
