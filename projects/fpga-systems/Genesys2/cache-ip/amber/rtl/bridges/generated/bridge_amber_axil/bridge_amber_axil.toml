#==============================================================================
# bridge_amber_axil.toml
#==============================================================================
# 1-master x 6-slave AXI4-Lite bridge for the amber pair-rig Genesys2 board
# bring-up harness.
#
# The single master is the host's UART -> AXIL bridge. The six slaves are:
#   harness_csr    global control/status + free-running cycle counter
#   cycle_injector0   per-core stimulus engine 0 config/status
#   cycle_injector1   per-core stimulus engine 1 config/status
#   tally_cnt         monbus_tally_axil count readback
#   tally_cfgw        monbus_tally_axil config write (CAM legal-set load)
#   tally_cfgr        monbus_tally_axil config/status readback
#
# Address map. Every slave occupies a whole 4 KB page (enforced by the bridge
# generator's config validator).
#   harness_csr       0x0001_0000  4 KB   AXIL
#   cycle_injector0   0x0002_0000  4 KB   AXIL
#   cycle_injector1   0x0003_0000  4 KB   AXIL
#   tally_cnt         0x0004_0000  4 KB   AXIL
#   tally_cfgw        0x0005_0000  4 KB   AXIL
#   tally_cfgr        0x0006_0000  4 KB   AXIL
#==============================================================================

[bridge]
name = "bridge_amber_axil"
description = "1xM AXIL bridge for amber pair-rig Genesys2 bring-up harness"
variants = ["no"]
mon_preset = "none"
use_cfg_regblock = false

[bridge.clock]
name = "aclk"
frequency_mhz = 90

# ---- Master -----------------------------------------------------------------
[[bridge.masters]]
name        = "host"
prefix      = "host_axi_"
protocol    = "axil"
channels    = "rw"
id_width    = 0
addr_width  = 32
data_width  = 32
user_width  = 0

# ---- Slaves -----------------------------------------------------------------
[[bridge.slaves]]
name        = "harness_csr"
prefix      = "harness_csr_axi_"
protocol    = "axil"
channels    = "rw"
id_width    = 8
addr_width  = 32
data_width  = 32
user_width  = 0
base_addr   = "0x00010000"
addr_range  = "0x00001000"     # 4 KB

[[bridge.slaves]]
name        = "cycle_injector0"
prefix      = "cycle_injector0_axi_"
protocol    = "axil"
channels    = "rw"
id_width    = 8
addr_width  = 32
data_width  = 32
user_width  = 0
base_addr   = "0x00020000"
addr_range  = "0x00001000"     # 4 KB

[[bridge.slaves]]
name        = "cycle_injector1"
prefix      = "cycle_injector1_axi_"
protocol    = "axil"
channels    = "rw"
id_width    = 8
addr_width  = 32
data_width  = 32
user_width  = 0
base_addr   = "0x00030000"
addr_range  = "0x00001000"     # 4 KB

[[bridge.slaves]]
name        = "tally_cnt"
prefix      = "tally_cnt_axi_"
protocol    = "axil"
channels    = "rd"
id_width    = 8
addr_width  = 32
data_width  = 64
user_width  = 0
base_addr   = "0x00040000"
addr_range  = "0x00001000"     # 4 KB

[[bridge.slaves]]
name        = "tally_cfgw"
prefix      = "tally_cfgw_axi_"
protocol    = "axil"
channels    = "wr"
id_width    = 8
addr_width  = 32
data_width  = 64
user_width  = 0
base_addr   = "0x00050000"
addr_range  = "0x00001000"     # 4 KB

[[bridge.slaves]]
name        = "tally_cfgr"
prefix      = "tally_cfgr_axi_"
protocol    = "axil"
channels    = "rd"
id_width    = 8
addr_width  = 32
data_width  = 64
user_width  = 0
base_addr   = "0x00060000"
addr_range  = "0x00001000"     # 4 KB
