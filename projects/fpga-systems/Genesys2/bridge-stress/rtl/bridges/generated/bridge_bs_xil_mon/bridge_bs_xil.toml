#============================================================================
# bridge_bs_xil -- the bridge stress model's third-party build: the bridge
# between our stress blocks and third-party IP that moves data of its own
# (AMD/Xilinx IP and LiteDRAM).
#
#   masters   cpu, dma   stress masters (dma on cclk: a master-side crossing)
#             atg        AXI Traffic Generator (axi_traffic_gen, Advanced
#                        mode): command lists the host writes, write data
#                        from its master RAM, read data back into it
#             cdma       AXI Central DMA (axi_cdma, simple mode, DRE on):
#                        copies the host starts, unaligned allowed
#   slaves    mem0, mem1 stress slaves (mem1 on cclk: a slave-side crossing)
#             ddr        LiteDRAM DDR3 (the board's 1 GB, 128-bit AXI4; its
#                        user_clk is aclk). It replaced MIG 7-series, whose
#                        controller wedged on this board (PRD findings)
#             bram       AXI BRAM Controller on a 64 KB block memory
#
# ddr and bram are real memories: the stress masters address them as mem
# windows (axi_stress_pkg f_maddr), so every write carries what a read of
# its bytes expects and one image covers both. The vendor masters reach
# only the memories: their data is the same image (the host loads the
# traffic generator's master RAM with it; the DMA copies it between equal
# offsets), and a stress slave would refuse it as write data.
#
# [harness] vendor: ports the harness brings out as pins for the board top
# to connect to the vendor IP, instead of building a stress block on them.
# Slave id_width is the fabric's ({master index, slot}); the validator checks it.
# ddr and bram declare 7, one wider than this fabric needs, so build-xmix (5
# masters, 7-bit slave IDs) shares their IP configuration (bs_litedram.yml,
# bs_xil_ip.tcl); the extra ID bit is 0 here.
#============================================================================

[harness]
vendor = ["atg", "cdma", "ddr", "bram"]

[bridge]
name = "bridge_bs_xil"
# "mon": an Ocelus monitor on every port (errors, timeouts) into the bridge's
# monbus group -- mem1, a cdc slave several masters share, is monitored on
# its own clock after its arbiter (bridge W9, bridge_mon_cdc). Its config is
# one regblock (use_cfg_regblock) and its error-FIFO drain is 32-bit, both
# on the configuration bridge (ext2 / ext3, gen_bs_harness), so the host
# reads which port, channel, ID and address went wrong.
variants = ["mon"]
use_cfg_regblock = true
description = "bridge stress model: 2 stress + 2 Xilinx masters x 2 stress slaves, LiteDRAM DDR3 and a Xilinx BRAM controller"

[bridge.mon_group]
s_axil_data_width = 32

[bridge.clock]
name = "aclk"
frequency_mhz = 100

[[bridge.masters]]
name       = "cpu"
prefix     = "cpu_axi_"
protocol   = "axi4"
channels   = "rw"
id_width   = 6
addr_width = 32
data_width = 64
user_width = 1

[[bridge.masters]]
name       = "dma"
prefix     = "dma_axi_"
protocol   = "axi4"
channels   = "rw"
id_width   = 4
addr_width = 32
data_width = 128
user_width = 1
cdc        = true

[[bridge.masters]]
name       = "atg"
prefix     = "atg_axi_"
protocol   = "axi4"
channels   = "rw"
id_width   = 2
addr_width = 32
data_width = 64
user_width = 1

[[bridge.masters]]
name       = "cdma"
prefix     = "cdma_axi_"
protocol   = "axi4"
channels   = "rw"
id_width   = 1
addr_width = 32
data_width = 64
user_width = 1

[[bridge.slaves]]
name       = "mem0"
prefix     = "mem0_axi_"
protocol   = "axi4"
channels   = "rw"
id_width   = 6
addr_width = 32
data_width = 64
user_width = 1
base_addr  = "0x00000000"
addr_range = "0x10000000"

[[bridge.slaves]]
name       = "mem1"
prefix     = "mem1_axi_"
protocol   = "axi4"
channels   = "rw"
id_width   = 6
addr_width = 32
data_width = 32
user_width = 1
cdc        = true
base_addr  = "0x10000000"
addr_range = "0x10000000"

[[bridge.slaves]]
name       = "bram"
prefix     = "bram_axi_"
protocol   = "axi4"
channels   = "rw"
id_width   = 7
addr_width = 32
data_width = 64
user_width = 1
base_addr  = "0x20000000"
addr_range = "0x00010000"

[[bridge.slaves]]
name       = "ddr"
prefix     = "ddr_axi_"
protocol   = "axi4"
channels   = "rw"
id_width   = 7
addr_width = 32
data_width = 128
user_width = 1
base_addr  = "0x40000000"
addr_range = "0x40000000"
