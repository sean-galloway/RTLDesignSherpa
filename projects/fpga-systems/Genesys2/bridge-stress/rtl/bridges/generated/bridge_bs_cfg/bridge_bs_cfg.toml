#============================================================================
# bridge_bs_cfg -- the bridge stress model's host configuration bridge.
#
# UART -> AXI4-Lite host master -> one APB register window per block: the
# harness control regs, and each stress master's and slave's own regblock
# (bstress_*_csr, which carries the access into the block's clock).
# Not under test: every build holds it constant.
#============================================================================

[bridge]
name = "bridge_bs_cfg"
description = "bridge stress model: host configuration bridge"
variants = ["no"]

[bridge.clock]
name = "aclk"
frequency_mhz = 100

[[bridge.masters]]
name        = "host"
prefix      = "host_axi_"
protocol    = "axil"
channels    = "rw"
id_width    = 0
addr_width  = 32
data_width  = 32
user_width  = 0

[[bridge.slaves]]
name        = "ctl"
prefix      = "ctl_apb_"
protocol    = "apb"
channels    = "rw"
id_width    = 0
addr_width  = 32
data_width  = 32
user_width  = 0
base_addr   = "0x00000000"
addr_range  = "0x00001000"

[[bridge.slaves]]
name        = "mst0"
prefix      = "mst0_apb_"
protocol    = "apb"
channels    = "rw"
id_width    = 0
addr_width  = 32
data_width  = 32
user_width  = 0
base_addr   = "0x00010000"
addr_range  = "0x00001000"

