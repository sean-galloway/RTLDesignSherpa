# Bridge Configuration: bridge_2x2_rw with the ddr slave on ITS OWN CLOCK
# (BRIDGE-017 cdc = true).
#
# The same two 32-bit AXI4 masters and two 32-bit AXI4 slaves as
# bridge_2x2_rw. ddr is a CDC slave port: the bridge top gains ddr_aclk /
# ddr_aresetn, and the ddr adapter carries AW/W/AR to the port and B/R back
# through axi4_cdc_{wr,rd} downstream of its timing wrapper (which, with its
# monitor, stays on aclk). sram is an ordinary same-clock port beside it, so
# one fixture holds both kinds. The generated TB runs ddr_aclk at
# BRIDGE_CDC_PERIOD_NS (default 7 ns); test_bridge_2x2_rw_cdc_ratio sweeps
# the ratio. Connectivity comes from bridge_2x2_rw_cdc_connectivity.csv.

[bridge]
name = "bridge_2x2_rw_cdc"
variants = ["no"]
description = "2 master x 2 slave rw bridge, ddr on its own clock (cdc = true)"

[[bridge.masters]]
name = "cpu"
prefix = "cpu_m_axi"
id_width = 4
addr_width = 32
data_width = 32
user_width = 1
channels = "rw"

[[bridge.masters]]
name = "dma"
prefix = "dma_m_axi"
id_width = 4
addr_width = 32
data_width = 32
user_width = 1
channels = "rw"

[[bridge.slaves]]
name = "ddr"
prefix = "ddr_s_axi"
id_width = 5  # {master index, master id}: 4-bit ID + 1 prefix bit (BRIDGE-016)
addr_width = 32
data_width = 32
user_width = 1
channels = "rw"
cdc = true
base_addr = "0x00000000"
addr_range = "0x80000000"

[[bridge.slaves]]
name = "sram"
prefix = "sram_s_axi"
id_width = 5  # {master index, master id}: 4-bit ID + 1 prefix bit (BRIDGE-016)
addr_width = 32
data_width = 32
user_width = 1
channels = "rw"
base_addr = "0x80000000"
addr_range = "0x80000000"
