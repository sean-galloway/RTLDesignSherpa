# Bridge Configuration: bridge_1x2_rd with the LITE monitors (TASK-098).
#
# Same fabric as bridge_1x2_rd; `mon_preset = "lite"` makes the `_mon`
# variant instantiate axi_monitor_lite inside every axi4_*_rd_mon wrapper
# (MONITOR_LITE=1) instead of axi_monitor_filtered. The generated monitor
# tests run unchanged against it, and `projects/components/bridge/fpga`
# measures it against bridge_1x2_rd_mon: same ports, a fifth of the gates.
# Connectivity comes from bridge_1x2_rd_lite_connectivity.csv.

[bridge]
name = "bridge_1x2_rd_lite"
variants = ["no", "mon"]
description = "1 master x 2 slave read-only bridge, monitors are axi_monitor_lite (mon_preset = lite, TASK-098)"
mon_preset = "lite"

[[bridge.masters]]
name = "cpu_rd"  # Descriptive identifier (cpu read master)
prefix = "cpu_rd_axi_"  # External signal prefix
id_width = 4
addr_width = 32
data_width = 32
user_width = 1
channels = "rd"  # Read-only (AR, R channels)
# Add the completion cone on top of the error_only baseline. The
# monitor capture/irq tests assert on completion packets at every
# wrapper boundary (the most reliably-produced packet type), so the
# compl cone must be enabled on each monitored port.
mon_add = ["compl"]
# No interface module = direct connection (for testing)

[[bridge.slaves]]
name = "ddr_rd"  # Descriptive identifier (ddr read slave)
prefix = "ddr_rd_axi_"  # External signal prefix
id_width = 4
addr_width = 32
data_width = 32
user_width = 1
channels = "rd"  # Read-only (AR, R channels) - must match master
mon_add = ["compl"]  # completion cone for monitor capture/irq tests
base_addr = "0x00000000"
addr_range = "0x80000000"  # 2GB
# No interface module = direct connection

[[bridge.slaves]]
name = "sram_rd"  # Descriptive identifier (sram read slave)
prefix = "sram_rd_axi_"  # External signal prefix
id_width = 4
addr_width = 32
data_width = 32
user_width = 1
channels = "rd"  # Read-only (AR, R channels) - must match master
mon_add = ["compl"]  # completion cone for monitor capture/irq tests
base_addr = "0x80000000"
addr_range = "0x80000000"  # 2GB
# No interface module = direct connection
