module: pumice_bank_timers
rtl_file: projects/components/mem-ctrl-ip/common-ip/rtl/fub/mc_bank_timers.sv
test_file: projects/components/mem-ctrl-ip/research-ip/pumice-ddr2-lpddr2/dv/tests/fub/test_pumice_bank_timers.py

parameters:
- name: NUM_RANKS
  default: 1
- name: NUM_BANKS
  default: 8
- name: ROW_WIDTH
  default: 14
- name: BANK_LA
  default: 0

coverage_points: []

functional_scenarios:
- id: BT-01
  name: Smoke
  description: "Reset leaves banks IDLE with act_ready high"
  test_function: test_pumice_bank_timers (smoke)
  priority: high
  status: verified
- id: BT-02
  name: ACT to tRCD
  description: "ACT loads row; rdwr_ready stays low until tRCD expires"
  test_function: test_pumice_bank_timers (act_to_rcd)
  priority: high
  status: verified
- id: BT-03
  name: Open-page streaming
  description: "Open-page RD/WR keep bank ACTIVE and rdwr_ready high"
  test_function: test_pumice_bank_timers (open_page_stream)
  priority: high
  status: verified
- id: BT-04
  name: tWR pre-gating
  description: "pre_ready stays low during write-recovery (tWR) window"
  test_function: test_pumice_bank_timers (pre_gating)
  priority: high
  status: verified
- id: BT-05
  name: Explicit PRE recovery
  description: "Explicit PRE -> tRP -> IDLE with act_ready high"
  test_function: test_pumice_bank_timers (explicit_pre)
  priority: high
  status: verified
- id: BT-06
  name: Auto-precharge
  description: "RDA auto-precharge returns bank to IDLE without explicit PRE"
  test_function: test_pumice_bank_timers (auto_precharge)
  priority: high
  status: verified

implied_coverage:
  total_scenarios: 6
  scenario_tracked: 6
  implied_covered: 6
  implied_percentage: 100.0

notes: |
  Thin wrapper instantiating one bank_timer per (rank,bank). Each bank_timer
  is FSM-free preset/decrement countdown plus an open-row register; the
  per-bank safe_act/rdwr/pre outputs AND the relevant timers (tRC/tRAS/tRP/
  tRCD/tWR/tRTP). The single cocotb test walks the five numbered phases
  above (BT-01 is the opening idle assertion). Cross-bank/rank windows
  (tCCD, tWTR, tRTW, tFAW, tRRD) live in pumice_global_timers; the arbiter
  ANDs those with these per-bank safe_* signals.
