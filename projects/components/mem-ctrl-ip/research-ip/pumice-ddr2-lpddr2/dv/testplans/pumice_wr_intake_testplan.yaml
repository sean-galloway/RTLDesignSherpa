- name: AXI_ID_WIDTH
  default: 8
- name: AXI_ADDR_WIDTH
  default: 32
- name: AXI_DATA_WIDTH
  default: 64
- name: NUM_RANKS
  default: 1
- name: NUM_BANKS
  default: 8
- name: ROW_WIDTH
  default: 14
- name: COL_WIDTH
  default: 10
- name: RAGGED_ASSERT
  default: 1
- name: AXI_BEATS_PER_BURST
  default: 4
- name: AW_FIFO_DEPTH
  default: 4
- name: WDATA_FIFO_DEPTH
  default: 16
- name: B_FIFO_DEPTH
  default: 4

coverage_points: []

functional_scenarios:
- id: WWI-01
  name: Smoke BL4 legal
  description: "Legal BL4 burst decode, data pass-through, commit B order"
  test_function: test_pumice_wr_intake (smoke)
  priority: high
  status: verified
- id: WWI-02
  name: Func BL4 legal
  description: "16 legal BL4 bursts; decoded push and ordered B responses"
  test_function: test_pumice_wr_intake (func)
  priority: medium
  status: verified
- id: WWI-03
  name: Full BL4 legal
  description: "48 legal BL4 bursts stress data path and B ordering"
  test_function: test_pumice_wr_intake (full)
  priority: low
  status: verified
- id: WWI-04
  name: Ragged BL4
  description: "Ragged BL4 raises aw_push_err and returns SLVERR B"
  test_function: test_pumice_wr_intake_ragged (ragged)
  priority: high
  status: verified
- id: WWI-05
  name: Smoke BL8 legal
  description: "Legal BL8 burst decode, data pass-through, commit B order"
  test_function: test_pumice_wr_intake_bl8 (smoke)
  priority: high
  status: verified
- id: WWI-06
  name: Func BL8 legal
  description: "16 legal BL8 bursts; decoded push and ordered B responses"
  test_function: test_pumice_wr_intake_bl8 (func)
  priority: medium
  status: verified
- id: WWI-07
  name: Full BL8 legal
  description: "48 legal BL8 bursts stress data path and B ordering"
  test_function: test_pumice_wr_intake_bl8 (full)
  priority: low
  status: verified
- id: WWI-08
  name: Ragged BL8
  description: "Ragged BL8 raises aw_push_err and returns SLVERR B"
  test_function: test_pumice_wr_intake_ragged_bl8 (ragged)
  priority: high
  status: verified

implied_coverage:
  total_scenarios: 8
  scenario_tracked: 8
  implied_covered: 8
  implied_percentage: 100.0

notes: |
  Dumb AXI4 write intake; one AXI burst equals one DFI burst. AW metadata
  and W beats buffer through FIFOs, the head AW decodes to rank/bank/row/
  col and pushes the wr-data CAM, write data pops to the downstream
  sequencer, and B responses return in commit order. Ragged bursts
  (awlen+1 != AXI_BEATS_PER_BURST) flag aw_push_err and self-generate a
  SLVERR B; the ragged wrappers build with RAGGED_ASSERT=0 so the RTL
  $error does not abort simulation. The BL8 wrappers close the
  on-silicon BL8 sub-DFI-word coverage gap.
