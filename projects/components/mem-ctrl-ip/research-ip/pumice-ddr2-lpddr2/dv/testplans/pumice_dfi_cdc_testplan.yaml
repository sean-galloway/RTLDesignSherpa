notes: |
  The single controller-to-PHY clock-domain crossing for pumice. All
  ctl_clk <-> dfi_clk traffic (commands, write data, read data) crosses
  through gaxi_fifo_async Gray-pointer FIFOs; init_start/init_complete
  cross as sticky event tokens. No hand-rolled synchronizers. Item count
  is TEST_LEVEL-scaled (dfi_cdc_items); the wrapper fixes the payload
  widths and FIFO depths above.
