module: pumice_dfi_cmd_path
rtl_file: projects/components/mem-ctrl-ip/mem-ctrl-research-ip/pumice-ddr2-lpddr2/rtl/fub/pumice_dfi_cmd_path.sv
test_file: projects/components/mem-ctrl-ip/mem-ctrl-research-ip/pumice-ddr2-lpddr2/dv/tests/fub/test_pumice_dfi_cmd_path.py

parameters:
- name: NUM_RANKS
  default: 1
- name: NUM_BANKS
  default: 8
- name: ROW_WIDTH
  default: 14
- name: COL_WIDTH
  default: 10
- name: DFI_RATE
  default: 4
- name: N_SUBCMD
  default: 1
- name: SUB_COL_STRIDE
  default: 1
- name: SUB_PHASE_STRIDE
  default: 1
- name: CMD_HISTORY_EN
  default: 0

coverage_points: []

functional_scenarios:
- id: DFICP-01
  name: Smoke
  description: "Command sequence drives correct DFI bus and fire strobes"
  test_function: test_pumice_dfi_cmd_path (smoke)
  priority: high
  status: verified
- id: DFICP-02
  name: Sub-DFI-word packing
  description: "Two RD sub-commands pack into one DFI word"
  test_function: test_pumice_dfi_cmd_path (pack)
  priority: high
  status: verified

implied_coverage:
  total_scenarios: 2
  scenario_tracked: 2
  implied_covered: 2
  implied_percentage: 100.0

notes: |
  DFI-domain command path. Pops the abstract command stream from the CDC
  FIFO, unpacks {op,rank,bank,row,col,ap}, and drives the multi-phase DFI
  command bus through dfi_cmd_formatter; emits wr_fire/rd_fire strobes for
  the data path. Supports sub-DFI-word burst packing when N_SUBCMD>1: the
  pack wrapper builds with N_SUBCMD=2, SUB_PHASE_STRIDE=2,
  SUB_COL_STRIDE=4 and packs two RD sub-commands into one DFI cycle at
  phases {0,2}; the smoke uses n_subcmd_i=1. CMD_HISTORY_EN passes the
  HIST_T_* parameters through to the optional pumice_cmd_history_checker
  scoreboard (off by default, no direct unit test — see testplans README).
