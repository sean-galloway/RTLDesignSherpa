notes: |
  Scheduler is the arbiter at the heart of the controller core. Per cycle:
    1. init_busy_i NOPs the bus while init_sequencer owns it
    2. mr_req_i / refresh_req_i / pdn_req_i preempt pending CAM slots
    3. Otherwise picks a wr/rd slot per QoS + age + page policy
    4. Walks S_IDLE → (S_NEED_PRE) → S_NEED_ACT → S_NEED_RDWR → S_DONE

  Key features verified:
    * 3 page policies (CLOSE / OPEN / HAPPY_HYBRID) — runtime inputs, not a
      build parameter
    * Auto-precharge selection (always-AP on CLOSE; predictor on HAPPY)
    * QoS-aware slot picker with lowest-index tie-break
    * S_DONE re-issue race guards (the canonical "registered strobe +
      consumer state lag" bug class — see test_patterns_strobe_race.md)

  CMD_HISTORY_EN=1 generates the optional pumice_cmd_history_checker
  scoreboard (HIST_T_RCD/RP/RAS/RFC/WTR/RRD/FAW/RTW windows) — audit-only,
  off by default, no direct unit test (see testplans README).

  SCHED-24 runs the same DUT through dv/tests/macro/test_pumice_sched_matrix.py:
  12 named legal operating points (pumice_dram_configs) x 6 paging modes with
  JEDEC command-stream checking — the layer where BUG-003 (rejected pick pushed
  anyway) was found. No AXI front end, CAMs, DFI, or PHY; the command stream
  is fully observable.
