  test_function: test_pumice_cmd_arbiter (cmd_ready_backpressure)
  priority: high
  status: verified
- id: ARB-09
  name: Column pipeline oldest-first
  description: "Pipelined row-hit columns issue oldest-first across cycles"
  test_function: test_pumice_cmd_arbiter (column_pipeline_oldest_first)
  priority: medium
  status: verified
- id: ARB-10
  name: Bank-parallel activate
  description: "Different idle banks activate oldest-first in parallel"
  test_function: test_pumice_cmd_arbiter (bank_parallel_activate)
  priority: high
  status: verified
- id: ARB-11
  name: Order mode overlay
  description: "in_order and age_threshold narrowing behave correctly"
  test_function: test_pumice_cmd_arbiter (order_mode_overlay)
  priority: medium
  status: verified
- id: ARB-12
  name: Row and column selection
  description: "most_pending and fewest_pending population selects work"
  test_function: test_pumice_cmd_arbiter (row_col_selection)
  priority: medium
  status: verified
- id: ARB-13
  name: Access preference
  description: "column_first, row_first, precharge_first class order"
  test_function: test_pumice_cmd_arbiter (access_preference)
  priority: medium
  status: verified
- id: ARB-14
  name: Write batching hysteresis
  description: "WR_WM high/low watermarks front-run reads during drain"
  test_function: test_pumice_cmd_arbiter (write_batching_hysteresis)
  priority: medium
  status: verified
- id: ARB-15
  name: Priority sub-policy
  description: "load_over_store, fair alternate, and age_boost modes"
  test_function: test_pumice_cmd_arbiter (prio_sub_policy)
  priority: medium
  status: verified
- id: ARB-16
  name: QoS-aware pick
  description: "QoS outer key with oldest tie-break inside QoS class"
  test_function: test_pumice_cmd_arbiter (qos_aware_pick)
  priority: medium
  status: verified
- id: ARB-17
  name: Issue rate floor
  description: "8-bank row-hit reads sustain >=0.95 fires/cycle"
  test_function: test_pumice_arbiter_issue_rate (issue_rate)
  priority: medium
  status: verified

implied_coverage:
  total_scenarios: 17
  scenario_tracked: 17
  implied_covered: 17
  implied_percentage: 100.0

notes: |
  Age-order argmax over the flat rd/wr CAM vectors picks one abstract DRAM
  command per cycle: init passthrough > refresh (PRE active banks, then REF)
  > column (read-over-write, oldest tie-break) > activate > precharge.
  Runtime policy overlays (order mode, row/col population select, access
  preference, QoS, write batching, priority sub-policy) and bank-parallel
  activation sit on top; the rank-global tRRD/tFAW windows are an AND input
  (BUG-021 hold-not-drop). The directed test compiles with
  +define+PUMICE_ENHANCED because it exercises order_mode 1/3 overlays the
  base build compiles out. ARB-17 lives in test_pumice_arbiter_issue_rate.py.
