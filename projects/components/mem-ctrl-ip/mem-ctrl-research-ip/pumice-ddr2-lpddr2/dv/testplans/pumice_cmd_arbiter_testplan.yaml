  priority: high
  status: verified
- id: ARB-03
  name: Read priority row-hit
  description: "RD wins over older WR when both hit open row"
  test_function: test_pumice_cmd_arbiter (read_priority_row_hit)
  priority: high
  status: verified
- id: ARB-04
  name: Oldest tie-break
  description: "Oldest RD candidate wins among multiple row-hits"
  test_function: test_pumice_cmd_arbiter (oldest_tie_break)
  priority: high
  status: verified
- id: ARB-05
