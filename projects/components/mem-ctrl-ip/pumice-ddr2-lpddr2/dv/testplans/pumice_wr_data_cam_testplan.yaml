module: pumice_wr_data_cam
rtl_file: projects/components/mem-ctrl-ip/pumice-ddr2-lpddr2/rtl/fub/pumice_wr_data_cam.sv
test_file: projects/components/mem-ctrl-ip/pumice-ddr2-lpddr2/dv/tests/fub/test_pumice_wr_data_cam.py

parameters:
- name: NUM_ENTRIES
  default: 8
- name: N_SCHED_LU
  default: 4
- name: NUM_BANKS
  default: 8
- name: ROW_WIDTH
  default: 14
- name: COL_WIDTH
  default: 10
- name: AXI_ID_WIDTH
  default: 8
- name: AXI_DATA_WIDTH
  default: 64
- name: AXI_BEATS_PER_BURST
  default: 4
- name: AGE_WIDTH
  default: 16
- name: WR_DRAIN_AHEAD
  default: 2

coverage_points: []

functional_scenarios:
- id: WDCAM-01
  name: Insert and oldest
  description: "Three inserts; oldest port returns the first entry"
  test_function: test_pumice_wr_data_cam (insert_oldest)
  priority: high
  status: verified
- id: WDCAM-02
  name: Snarf hit and miss
  description: "Snarf hits matching entry and misses unknown address"
  test_function: test_pumice_wr_data_cam (snarf_basic)
  priority: high
  status: verified
- id: WDCAM-03
  name: Snarf ID mismatch
  description: "Snarf misses on matching address but mismatched AXI ID"
  test_function: test_pumice_wr_data_cam (snarf_id_mismatch)
  priority: high
  status: verified
- id: WDCAM-04
  name: Snarf length mismatch
  description: "Snarf misses when read burst length differs from write"
  test_function: test_pumice_wr_data_cam (snarf_len_mismatch)
  priority: high
  status: verified
- id: WDCAM-05
  name: WAW snarf youngest
  description: "Write-after-write snarf returns newest data for same key"
  test_function: test_pumice_wr_data_cam (waw_youngest)
  priority: high
  status: verified
- id: WDCAM-06
  name: Scheduler oldest match
  description: "Scheduler lookup returns oldest match per bank and row"
  test_function: test_pumice_wr_data_cam (sched_oldest_match)
  priority: high
  status: verified
- id: WDCAM-07
  name: Commit and evict
  description: "Commit oldest drains correct burst and advances oldest"
  test_function: test_pumice_wr_data_cam (commit_evict)
  priority: high
  status: verified
- id: WDCAM-08
  name: Scheduled write blocks snarf
  description: "Scheduled write is not snarfable while draining"
  test_function: test_pumice_wr_data_cam (scheduled_no_snarf)
  priority: high
  status: verified
- id: WDCAM-09
  name: Wave10 pipelined drain
  description: "Same-bank drain keeps commit_ready high with one B per burst"
  test_function: test_pumice_wr_data_cam (wave10_drain)
  priority: medium
  status: verified

implied_coverage:
  total_scenarios: 9
  scenario_tracked: 9
  implied_covered: 9
  implied_percentage: 100.0

notes: |
  Write-command CAM plus write-data SRAM. Holds pending writes keyed on
  {bank,row,col} with wrap-safe age ordering, and exposes a youngest-match
  snarf port (read-your-writes for pumice_rd_intake), an oldest-match
  scheduler lookup port, and a commit/drain stream to the DFI write path.
  The single cocotb test runs the nine sub-scenarios as a directed sequence;
  wave10_rounds is the only TEST_LEVEL-scaled repetition. Snarf correctness
  rests on three tested limits: AXI ID match, burst-length match, and
  not-yet-scheduled state.
