module: pumice_dfi_layer
rtl_file: projects/components/mem-ctrl-ip/pumice-ddr2-lpddr2/rtl/macro/pumice_dfi_layer.sv
test_file: projects/components/mem-ctrl-ip/pumice-ddr2-lpddr2/dv/tests/macro/test_pumice_dfi_layer.py

parameters:
- name: NUM_RANKS
  default: 1
- name: NUM_BANKS
  default: 8
- name: ROW_WIDTH
  default: 14
- name: COL_WIDTH
  default: 10
- name: DFI_RATE
  default: 2
- name: DRAM_BEAT_WIDTH
  default: 64
- name: DFI_BEATS_PER_BURST
  default: 8
- name: N_SUBCMD
  default: 1
- name: RD_MAX_OUTSTANDING
  default: 16

coverage_points: []

functional_scenarios:
- id: DFIL-01
  name: Smoke
  description: "End-to-end write/read round trip across the DFI layer"
  test_function: test_pumice_dfi_layer (smoke)
  priority: high
  status: verified

implied_coverage:
  total_scenarios: 1
  scenario_tracked: 1
  implied_covered: 1
  implied_percentage: 100.0

notes: |
  Top-level DFI layer macro. Holds the single controller<->PHY CDC
  (pumice_dfi_cdc) plus the dfi_clk command path (pumice_dfi_cmd_path),
  write serializer (pumice_dfi_wr_serializer), and read aligner
  (pumice_dfi_rd_aligner); ctl_clk command/write/read streams in one side,
  DFI 2.1 pin bus out the other. The smoke test closes the loop with a
  DFI-domain memory model that requires all-phase (FULL_EN) enables at
  gear == MAX and returns captured write data on read. The wrapper uses
  board clock periods (pumice_top_csr_tb.board_clock_periods) with
  DFI_RATE=2, DRAM_BEAT_WIDTH=64, BL=8; round-trip count is
  TEST_LEVEL-scaled (dfi_layer_roundtrips). Unit-level behavior of the
  four children is planned separately in pumice_dfi_cdc/cmd_path/
  rd_aligner/wr_serializer testplans.
