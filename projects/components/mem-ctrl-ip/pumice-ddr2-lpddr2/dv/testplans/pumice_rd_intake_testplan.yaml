module: pumice_rd_intake
rtl_file: projects/components/mem-ctrl-ip/pumice-ddr2-lpddr2/rtl/fub/pumice_rd_intake.sv
test_file: projects/components/mem-ctrl-ip/pumice-ddr2-lpddr2/dv/tests/fub/test_pumice_rd_intake.py

parameters:
- name: AXI_ID_WIDTH
  default: 8
- name: AXI_ADDR_WIDTH
  default: 32
- name: AXI_DATA_WIDTH
  default: 64
- name: NUM_RANKS
  default: 1
- name: NUM_BANKS
  default: 8
- name: ROW_WIDTH
  default: 14
- name: COL_WIDTH
  default: 10
- name: AXI_BEATS_PER_BURST
  default: 4
- name: AR_FIFO_DEPTH
  default: 4
- name: ORDER_FIFO_DEPTH
  default: 8
- name: RD_FIFO_DEPTH
  default: 16

coverage_points: []

functional_scenarios:
- id: RDI-01
  name: Smoke
  description: "6 mixed snarf/DFI reads; AR-order R and decoded miss push"
  test_function: test_pumice_rd_intake (smoke)
  priority: high
  status: verified
- id: RDI-02
  name: Func
  description: "24 mixed reads stress ordering and source arbitration"
  test_function: test_pumice_rd_intake (func)
  priority: medium
  status: verified
- id: RDI-03
  name: Full
  description: "64 mixed reads stress across snarf and DFI return paths"
  test_function: test_pumice_rd_intake (full)
  priority: low
  status: verified

implied_coverage:
  total_scenarios: 3
  scenario_tracked: 3
  implied_covered: 3
  implied_percentage: 100.0

notes: |
  Dumb AXI4 read intake with a write-CAM snarf path; one AXI burst maps to
  one DFI burst. AR addresses decode to rank/bank/row/col, probe the write
  CAM (hit -> snarf stream, miss -> ar_push to scheduler/rd CAM), and R
  beats return in strict AR order from either source. The order FIFO tags
  each admitted read with source + id so split bursts collapse RLAST
  correctly. One cocotb test; TEST_LEVEL scales the mixed-read count
  (gate/basic->smoke, func/medium->func, full->full). Snarf-hit and miss
  address spaces are kept disjoint via word-address bit 18.
