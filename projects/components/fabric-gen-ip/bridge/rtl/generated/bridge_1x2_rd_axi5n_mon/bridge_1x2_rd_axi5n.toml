# Bridge Configuration: 1x2 read-only bridge with NATIVE AXI5 sideband
# (bridge TASK-002 (was BRIDGE-002) phase A5-2 slice 2).
#
# Geometry copies bridge_1x2_rd_axi5s, but BOTH ends of the sram path
# are AXI5 and width-matched, so the enabled sideband (nsaid, trace,
# unique) rides the fabric structs end-to-end:
#   cpu_rd (AXI5) -> struct fields -> xbar -> sram_rd (AXI5)  [native]
#   cpu_rd (AXI5) -> ddr_rd (AXI4)                    [drops, warning]
# rtrace returns natively from sram_rd; reads from ddr_rd see rtrace=0.
# 'wakeup' (GitHub #102 item 5) on both AXI5 ports: a read-only port carries
# the single AWAKEUP too (it covers both request channels, A14.1.1).
# Connectivity comes from bridge_1x2_rd_axi5n_connectivity.csv.

[bridge]
name = "bridge_1x2_rd_axi5n"
variants = ["no", "mon"]
description = "AXI5 master x (1 AXI4 + 1 AXI5) slave rd bridge, native sideband (A5-2 slice 2)"

[[bridge.masters]]
name = "cpu_rd"
prefix = "cpu_rd_axi_"
id_width = 4
addr_width = 32
data_width = 32
user_width = 1
channels = "rd"
protocol = "axi5"
axi5_features = ["nsaid", "trace", "unique", "wakeup"]

[[bridge.slaves]]
name = "ddr_rd"  # stays AXI4: the sideband drop path
prefix = "ddr_rd_axi_"
id_width = 4
addr_width = 32
data_width = 32
user_width = 1
channels = "rd"
base_addr = "0x00000000"
addr_range = "0x80000000"

[[bridge.slaves]]
name = "sram_rd"  # AXI5, same features + width as the master: native path
prefix = "sram_rd_axi_"
id_width = 4
addr_width = 32
data_width = 32
user_width = 1
channels = "rd"
protocol = "axi5"
axi5_features = ["nsaid", "trace", "unique", "wakeup"]
base_addr = "0x80000000"
addr_range = "0x80000000"

# bridge TASK-023: the generator's mon_group default is now the write-only
# 1wr group; this fixture keeps the two-port monbus_axil4_axil4_group --
# its DV drains the s_mon_axil_* surface.
[bridge.mon_group]
write_only = false
