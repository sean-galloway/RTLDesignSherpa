# Bridge Configuration: two LITE requesters into an AXI4 fabric (bridge TASK-004, was BRIDGE-014).
#
# Masters are an AXI4-Lite port and an AXI5-Lite port. The AXI4-Lite one has
# no transaction ID; the AXI5-Lite one carries a 1-bit AWID/ARID (required on
# an AXI5-Lite Subordinate, IHI 0022L B2.1.5, GitHub #102 item 3), so the
# fabric ID is {master index, 1-bit id} (bridge TASK-005, was BRIDGE-016) and
# the slaves see 2-bit IDs. The AXI5-Lite master enables the one forwardable
# group, 'user', which rides the fabric's 1-bit USER fields to the AXI5-Lite
# slave. ('exclusive' went with AxLOCK: AXI5-Lite has no exclusive access.)
# TRACE and POISON are exposed and terminated at the bridge top.
#
# The 64-bit AXI4 slave makes both Lite masters take the wide-slave aligner
# (a narrow single-beat write must land in the right byte lanes of the wide
# row); the AXI5-Lite slave is same-width so its path is a plain shim.
# Connectivity comes from bridge_2x2_lite_req_connectivity.csv.

[bridge]
name = "bridge_2x2_lite_req"
variants = ["no", "mon"]
description = "AXI4-Lite + AXI5-Lite masters x AXI4 (64b) + AXI5-Lite slaves rw bridge (bridge TASK-004, was BRIDGE-014)"

[[bridge.masters]]
name = "lite4"
prefix = "lite4_axil_"
id_width = 0
addr_width = 32
data_width = 32
user_width = 1
channels = "rw"
protocol = "axil"

[[bridge.masters]]
name = "lite5"
prefix = "lite5_axil_"
id_width = 1  # AXI5-Lite AWID/ARID (B2.1.5)
addr_width = 32
data_width = 32
user_width = 1
channels = "rw"
protocol = "axil5"
axi5_features = ["user"]

[[bridge.slaves]]
name = "mem"
prefix = "mem_axi_"
id_width = 2  # {master index, master id}: 1-bit placeholder ID + 1 prefix bit (bridge TASK-005, was BRIDGE-016)
addr_width = 32
data_width = 64
user_width = 1
channels = "rw"
protocol = "axi4"
base_addr = "0x00000000"
addr_range = "0x10000000"

[[bridge.slaves]]
name = "regs"
prefix = "regs_axil_"
id_width = 0
addr_width = 32
data_width = 32
user_width = 1
channels = "rw"
protocol = "axil5"
axi5_features = ["user"]  # forwards the master's user; a group the slave does not enable is gated to 0 at its shim
base_addr = "0x40000000"
addr_range = "0x00010000"

# bridge TASK-023: the generator's mon_group default is now the write-only
# 1wr group; this fixture keeps the two-port monbus_axil4_axil4_group --
# its DV drains the s_mon_axil_* surface.
[bridge.mon_group]
write_only = false
