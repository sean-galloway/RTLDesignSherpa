# Illegal Bridge Configuration: AXI3 port with AXI5 features
# axi5_features is only legal on axi5/axil5 ports
# bridge GitHub #97

[bridge]
name = "illegal_axi3_axi5_features"
variants = ["no"]
description = "ILLEGAL: AXI3 port cannot declare axi5_features"

[[bridge.masters]]
name = "axi3_master"
prefix = "axi3_master_axi_"
id_width = 4
addr_width = 32
data_width = 64
user_width = 1
channels = "rw"
protocol = "axi3"
axi5_features = ["trace"]  # ILLEGAL! Only legal on axi5/axil5

[[bridge.slaves]]
name = "axi3_slave"
prefix = "axi3_slave_axi_"
id_width = 4
addr_width = 32
data_width = 64
user_width = 1
channels = "rw"
protocol = "axi3"
base_addr = "0x00000000"
addr_range = "0x10000000"
