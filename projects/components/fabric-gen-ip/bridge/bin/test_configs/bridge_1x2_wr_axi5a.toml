# Bridge Configuration: 1x2 write-only bridge with NATIVE store-class
# ATOMICS (bridge TASK-002 (was BRIDGE-002) phase A5-3a).
#
# 'atomic' is connectivity-gated like poison: legal here because every
# connected slave is AXI5, atomic-enabled, and width-matched. aw.atop
# rides the fabric structs; the master adapter's axi5_atomic_filter
# DECERRs read-return classes (AtomicLoad/Swap/Compare) locally and
# forwards AtomicStore + plain writes natively.
# 'unique' on the master only (GitHub #102 item 5): BIDUNQ is regenerated on
# the wrapper side of the filter, so even a locally-DECERRed atomic answers
# with its own AWIDUNQ. The write-only port has no R channel, so a load-class
# atomic completes with DECERR on B only and its owed R beats are discarded
# inside the filter (HAS 4.4) -- managers must not issue them here.
# Connectivity comes from bridge_1x2_wr_axi5a_connectivity.csv.

[bridge]
name = "bridge_1x2_wr_axi5a"
variants = ["no", "mon"]
description = "AXI5 master x 2 AXI5 slaves wr bridge, store-class atomics (A5-3a)"

[[bridge.masters]]
name = "cpu_wr"
prefix = "cpu_wr_axi_"
id_width = 4
addr_width = 32
data_width = 32
user_width = 1
channels = "wr"
protocol = "axi5"
axi5_features = ["trace", "atomic", "unique"]

[[bridge.slaves]]
name = "ddr_wr"
prefix = "ddr_wr_axi_"
id_width = 4
addr_width = 32
data_width = 32
user_width = 1
channels = "wr"
protocol = "axi5"
axi5_features = ["trace", "atomic"]
base_addr = "0x00000000"
addr_range = "0x80000000"

[[bridge.slaves]]
name = "sram_wr"  # atomic only: trace drops here (warning)
prefix = "sram_wr_axi_"
id_width = 4
addr_width = 32
data_width = 32
user_width = 1
channels = "wr"
protocol = "axi5"
axi5_features = ["atomic"]
base_addr = "0x80000000"
addr_range = "0x80000000"

# bridge TASK-023: the generator's mon_group default is now the write-only
# 1wr group; this fixture keeps the two-port monbus_axil4_axil4_group --
# its DV drains the s_mon_axil_* surface.
[bridge.mon_group]
write_only = false
