#==============================================================================
#==============================================================================
#
# 2 masters (1 axi4 + 1 axil) → 3 slaves (1 axi4 + 1 axil + 1 apb).
# Bridge preset turns ON every reporter sub-block at every port (worst-case
# PortSpec.get_mon_enables().
#==============================================================================

[bridge]
name = "bridge_mix_c"
description = "mixed axi4/axil masters → axi4/axil/apb slaves"
variants = ["no", "mon"]
# Monitors: every monitored port builds axi_monitor_lite through the _monlite
# wrapper (2026-09-26). The cone presets and per-port mon_add/mon_remove this
# file once carried no longer select hardware; which packets a port emits is
# the runtime cfg_*_enable pins. use_monitor = false removes a port's monitor.
mon_preset = "lite"

[bridge.clock]
name = "aclk"
frequency_mhz = 100

# ---------------------------------------------------------------- masters ---

# CPU — keeps everything (worst-case observability).
[[bridge.masters]]
name      = "cpu_axi4"
prefix    = "cpu_axi4_"
protocol  = "axi4"
channels  = "rw"
id_width  = 4
addr_width = 32
data_width = 64
user_width = 1

# Host AXIL — drop perf + threshold (we don't need rollups on a config port).
[[bridge.masters]]
name      = "host_axil"
prefix    = "host_axil_"
protocol  = "axil"
channels  = "rw"
id_width  = 0
addr_width = 32
data_width = 32
user_width = 1

# ---------------------------------------------------------------- slaves ----

# DDR — keep everything.
[[bridge.slaves]]
name      = "ddr"
prefix    = "ddr_s_axi_"
protocol  = "axi4"
channels  = "rw"
id_width  = 5  # {master index, master id}: 4-bit ID + 1 prefix bit(s) (bridge TASK-005, was BRIDGE-016)
addr_width = 32
data_width = 64
user_width = 1
base_addr  = "0x00000000"
addr_range = "0x40000000"

[[bridge.slaves]]
name      = "cfg_regs"
prefix    = "cfg_regs_"
protocol  = "axil"
channels  = "rw"
id_width  = 0
addr_width = 32
data_width = 32
user_width = 1
base_addr  = "0x40000000"
addr_range = "0x00010000"

# APB peripheral — keep everything (small block, area cost is tiny).
[[bridge.slaves]]
name      = "apb_periph"
prefix    = "apb_periph_"
protocol  = "apb"
channels  = "rw"
id_width  = 0
addr_width = 32
data_width = 32
user_width = 0
base_addr  = "0x40010000"
addr_range = "0x00010000"
