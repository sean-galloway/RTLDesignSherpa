# Illegal Bridge Configuration: AXI3 port with non-AXI3 data width
# AXI3 data width must be 32, 64, 128, or 256 bits
# bridge GitHub #97

[bridge]
name = "illegal_axi3_bad_width"
variants = ["no"]
description = "ILLEGAL: AXI3 data width must be one of {32,64,128,256}"

[[bridge.masters]]
name = "axi3_master"
prefix = "axi3_master_axi_"
id_width = 4
addr_width = 32
data_width = 16  # ILLEGAL! AXI3 only supports 32/64/128/256
user_width = 1
channels = "rw"
protocol = "axi3"

[[bridge.slaves]]
name = "axi3_slave"
prefix = "axi3_slave_axi_"
id_width = 4
addr_width = 32
data_width = 64
user_width = 1
channels = "rw"
protocol = "axi3"
base_addr = "0x00000000"
addr_range = "0x10000000"
