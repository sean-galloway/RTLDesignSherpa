<svg  xmlns="http://www.w3.org/2000/svg"
  xmlns:xlink="http://www.w3.org/1999/xlink"
  xmlns:s="https://github.com/nturley/netlistsvg"
  width="800" height="300">
  <s:properties>
    <s:layoutEngine
      org.eclipse.elk.layered.spacing.nodeNodeBetweenLayers="60"
      org.eclipse.elk.spacing.nodeNode= "45"
      org.eclipse.elk.direction= "RIGHT"
      org.eclipse.elk.layered.mergeEdges= "true"
      org.eclipse.elk.layered.layering.strategy= "LONGEST_PATH"
    />
    <s:low_priority_alias val="$dff" />
  </s:properties>
<style>
svg {
  stroke:#000;
  fill:none;
}
text {
  fill:#000;
  stroke:none;
  font-size:10px;
  font-weight: bold;
  font-family: "Courier New", monospace;
}
.nodelabel {
  text-anchor: middle;
}
.inputPortLabel {
  text-anchor: end;
}
.splitjoinBody {
  fill:#000;
}
</style>
  <g s:type="mux" transform="translate(50, 50)" s:width="24" s:height="48">
    <s:alias val="$mux"/>
    <s:alias val="$_MUX_"/>

    <path d="M0,0 L24,12 L24,36 L0,48 Z" class="$cell_id"/>

    <g s:x="0" s:y="12" s:pid="A"/>
    <g s:x="0" s:y="36" s:pid="B"/>
    <g s:x="12" s:y="43" s:pid="S"/>
    <g s:x="24" s:y="24" s:pid="Y"/>
  </g>

  <!-- and -->
  <g s:type="and" transform="translate(150,50)" s:width="30" s:height="25">
    <s:alias val="$and"/>
    <s:alias val="$logic_and"/>
    <s:alias val="$_AND_"/>

    <path d="M0,0 L0,25 L15,25 A15 12.5 0 0 0 15,0 Z" class="$cell_id"/>

    <g s:x="0" s:y="5" s:pid="A"/>
    <g s:x="0" s:y="20" s:pid="B"/>
    <g s:x="30" s:y="12.5" s:pid="Y"/>
  </g>
  <g s:type="nand" transform="translate(150,100)" s:width="30" s:height="25">
    <s:alias val="$nand"/>
    <s:alias val="$logic_nand"/>
    <s:alias val="$_NAND_"/>
    <s:alias val="$_ANDNOT_"/>

    <path d="M0,0 L0,25 L15,25 A15 12.5 0 0 0 15,0 Z" class="$cell_id"/>
    <circle cx="34" cy="12.5" r="3" class="$cell_id"/>

    <g s:x="0" s:y="5" s:pid="A"/>
    <g s:x="0" s:y="20" s:pid="B"/>
    <g s:x="36" s:y="12.5" s:pid="Y"/>
  </g>

  <!-- or -->
  <g s:type="or" transform="translate(250,50)" s:width="30" s:height="25">
    <s:alias val="$or"/>
    <s:alias val="$logic_or"/>
    <s:alias val="$_OR_"/>

    <path d="M0,25 L0,25 L15,25 A15 12.5 0 0 0 15,0 L0,0" class="$cell_id"/>
    <path d="M0,0 A30 25 0 0 1 0,25" class="$cell_id"/>

    <g s:x="3" s:y="5" s:pid="A"/>
    <g s:x="3" s:y="20" s:pid="B"/>
    <g s:x="30" s:y="12.5" s:pid="Y"/>
  </g>
  <g s:type="reduce_nor" transform="translate(250, 100)" s:width="33" s:height="25">
    <s:alias val="$nor"/>
    <s:alias val="$reduce_nor"/>
    <s:alias val="$_NOR_"/>
    <s:alias val="$_ORNOT_"/>

    <path d="M0,25 L0,25 L15,25 A15 12.5 0 0 0 15,0 L0,0" class="$cell_id"/>
    <path d="M0,0 A30 25 0 0 1 0,25" class="$cell_id"/>
    <circle cx="34" cy="12.5" r="3" class="$cell_id"/>

    <g s:x="3" s:y="5" s:pid="A"/>
    <g s:x="3" s:y="20" s:pid="B"/>
    <g s:x="36" s:y="12.5" s:pid="Y"/>
  </g>

  <!--xor -->
  <g s:type="reduce_xor" transform="translate(350, 50)" s:width="33" s:height="25">
    <s:alias val="$xor"/>
    <s:alias val="$reduce_xor"/>
    <s:alias val="$_XOR_"/>

    <path d="M3,0 A30 25 0 0 1 3,25 A30 25 0 0 0 33,12.5 A30 25 0 0 0 3,0" class="$cell_id"/>
    <path d="M0,0 A30 25 0 0 1 0,25" class="$cell_id"/>

    <g s:x="3" s:y="5" s:pid="A"/>
    <g s:x="3" s:y="20" s:pid="B"/>
    <g s:x="33" s:y="12.5" s:pid="Y"/>
  </g>
  <g s:type="reduce_nxor" transform="translate(350, 100)" s:width="33" s:height="25">
    <s:alias val="$xnor"/>
    <s:alias val="$reduce_xnor"/>
    <s:alias val="$_XNOR_"/>

    <path d="M3,0 A30 25 0 0 1 3,25 A30 25 0 0 0 33,12.5 A30 25 0 0 0 3,0" class="$cell_id"/>
    <path d="M0,0 A30 25 0 0 1 0,25" class="$cell_id"/>
    <circle cx="35" cy="12.5" r="3" class="$cell_id"/>

    <g s:x="3" s:y="5" s:pid="A"/>
    <g s:x="3" s:y="20" s:pid="B"/>
    <g s:x="38" s:y="12.5" s:pid="Y"/>
  </g>

  <!--buffer -->
  <g s:type="not" transform="translate(450,100)" s:width="30" s:height="20">
    <s:alias val="$_NOT_"/>
    <s:alias val="$not"/>
    <s:alias val="$logic_not"/>

    <path d="M0,0 L0,20 L20,10 Z" class="$cell_id"/>
    <circle cx="23" cy="10" r="3" class="$cell_id"/>

    <g s:x="0" s:y="10" s:pid="A"/>
    <g s:x="25" s:y="10" s:pid="Y"/>
  </g>

  <g s:type="add" transform="translate(50, 150)" s:width="25" s:height="25">
    <s:alias val="$add"/>

    <circle r="12.5" cx="12.5" cy="12.5" class="$cell_id"/>
    <line x1="7.5" x2="17.5" y1="12.5" y2="12.5" class="$cell_id"/>
    <line x1="12.5" x2="12.5" y1="7.5" y2="17.5" class="$cell_id"/>

    <g s:x="3" s:y="5" s:pid="A"/>
    <g s:x="3" s:y="20" s:pid="B"/>
    <g s:x="25" s:y="12.5" s:pid="Y"/>
  </g>

  <g s:type="sub" transform="translate(150,150)" s:width="25" s:height="25">
    <s:alias val="$sub"/>

    <circle r="12.5" cx="12.5" cy="12.5" class="$cell_id"/>
    <line x1="7.5" x2="17.5" y1="12.5" y2="12.5" class="$cell_id"/>

    <g s:x="3" s:y="5" s:pid="A"/>
    <g s:x="3" s:y="20" s:pid="B"/>
    <g s:x="25" s:y="12.5" s:pid="Y"/>
  </g>
  <g s:type="eq" transform="translate(250,150)" s:width="25" s:height="25">
    <s:alias val="$eq"/>

    <circle r="12.5" cx="12.5" cy="12.5" class="$cell_id"/>
    <line x1="7.5" x2="17.5" y1="10" y2="10" class="$cell_id"/>
    <line x1="7.5" x2="17.5" y1="15" y2="15" class="$cell_id"/>

    <g s:x="3" s:y="5" s:pid="A"/>
    <g s:x="3" s:y="20" s:pid="B"/>
    <g s:x="25" s:y="12.5" s:pid="Y"/>
  </g>

  <g s:type="dff" transform="translate(350,150)" s:width="30" s:height="40">
    <s:alias val="$dff"/>
    <s:alias val="$_DFF_"/>
    <s:alias val="$_DFF_P_"/>

    <rect width="30" height="40" x="0" y="0" class="$cell_id"/>
    <path d="M0,35 L5,30 L0,25" class="$cell_id"/>

    <g s:x="30" s:y="10" s:pid="Q"/>
    <g s:x="0" s:y="30" s:pid="CLK"/>
    <g s:x="0" s:y="30" s:pid="C"/>
    <g s:x="0" s:y="10" s:pid="D"/>
  </g>

  <g s:type="dffn" transform="translate(450,150)" s:width="30" s:height="40">
    <s:alias val="$_DFF_N_"/>

    <rect width="30" height="40" x="0" y="0" class="$cell_id"/>
    <path d="M0,35 L5,30 L0,25" class="$cell_id"/>
    <circle cx="-3" cy="30" r="3" class="$cell_id"/>

    <g s:x="30" s:y="10" s:pid="Q"/>
    <g s:x="-6" s:y="30" s:pid="CLK"/>
    <g s:x="-6" s:y="30" s:pid="C"/>
    <g s:x="0" s:y="10" s:pid="D"/>
  </g>

  <g s:type="lt" transform="translate(50,200)" s:width="25" s:height="25">
    <s:alias val="$lt"/>

    <circle r="12.5" cx="12.5" cy="12.5" class="$cell_id"/>
    <line x1="7.5" x2="17.5" y1="12.5" y2="7.5" class="$cell_id"/>
    <line x1="7.5" x2="17.5" y1="12.5" y2="17.5" class="$cell_id"/>

    <g s:x="3" s:y="5" s:pid="A"/>
    <g s:x="3" s:y="20" s:pid="B"/>
    <g s:x="25" s:y="12.5" s:pid="Y"/>
  </g>

  <g s:type="le" transform="translate(150,200)" s:width="25" s:height="25">
    <s:alias val="$le"/>

    <circle r="12.5" cx="12.5" cy="12.5" class="$cell_id"/>
    <line x1="7.5" x2="17.5" y1="12.5" y2="7.5" class="$cell_id"/>
    <line x1="7.5" x2="17.5" y1="12.5" y2="17.5" class="$cell_id"/>
    <line x1="7.5" x2="17.5" y1="15" y2="20" class="$cell_id"/>

    <g s:x="3" s:y="5" s:pid="A"/>
    <g s:x="3" s:y="20" s:pid="B"/>
    <g s:x="25" s:y="12.5" s:pid="Y"/>
  </g>

  <g s:type="ge" transform="translate(250,200)" s:width="25" s:height="25">
    <s:alias val="$ge"/>

    <circle r="12.5" cx="12.5" cy="12.5" class="$cell_id"/>
    <line x1="7.5" x2="17.5" y1="7.5" y2="12.5" class="$cell_id"/>
    <line x1="7.5" x2="17.5" y1="17.5" y2="12.5" class="$cell_id"/>
    <line x1="7.5" x2="17.5" y1="20" y2="15" class="$cell_id"/>

    <g s:x="3" s:y="5" s:pid="A"/>
    <g s:x="3" s:y="20" s:pid="B"/>
    <g s:x="25" s:y="12.5" s:pid="Y"/>
  </g>

  <g s:type="gt" transform="translate(350,200)" s:width="25" s:height="25">
    <s:alias val="$gt"/>

    <circle r="12.5" cx="12.5" cy="12.5" class="$cell_id"/>
    <line x1="7.5" x2="17.5" y1="7.5" y2="12.5" class="$cell_id"/>
    <line x1="7.5" x2="17.5" y1="17.5" y2="12.5" class="$cell_id"/>

    <g s:x="3" s:y="5" s:pid="A"/>
    <g s:x="3" s:y="20" s:pid="B"/>
    <g s:x="25" s:y="12.5" s:pid="Y"/>
  </g>

  <g s:type="inputExt" transform="translate(50,250)" s:width="30" s:height="20">
    <text x="15" y="-4" class="nodelabel $cell_id" s:attribute="ref">input</text>
    <s:alias val="$_inputExt_"/>
    <path d="M0,0 L0,20 L15,20 L30,10 L15,0 Z" class="$cell_id"/>
    <g s:x="28" s:y="10" s:pid="Y"/>
  </g>

  <g s:type="constant" transform="translate(150,250)" s:width="30" s:height="20">
    <text x="15" y="-4" class="nodelabel $cell_id" s:attribute="ref">constant</text>

    <s:alias val="$_constant_"/>
    <rect width="30" height="20" class="$cell_id"/>

    <g s:x="30" s:y="10" s:pid="Y"/>
  </g>

  <g s:type="outputExt" transform="translate(250,250)" s:width="30" s:height="20">
    <text x="15" y="-4" class="nodelabel $cell_id" s:attribute="ref">output</text>
    <s:alias val="$_outputExt_"/>
    <path d="M30,0 L30,20 L15,20 L0,10 L15,0 Z" class="$cell_id"/>

    <g s:x="0" s:y="10" s:pid="A"/>
  </g>

  <g s:type="split" transform="translate(350,250)" s:width="5" s:height="40">
    <rect width="5" height="40" class="splitjoinBody" s:generic="body"/>
    <s:alias val="$_split_"/>

    <g s:x="0" s:y="20" s:pid="in"/>
    <g transform="translate(5, 10)" s:x="4" s:y="10" s:pid="out0">
      <text x="5" y="-4">hi:lo</text>
    </g>
    <g transform="translate(5, 30)" s:x="4" s:y="30" s:pid="out1">
      <text x="5" y="-4">hi:lo</text>
    </g>
  </g>

  <g s:type="join" transform="translate(450,250)" s:width="4" s:height="40">
    <rect width="5" height="40" class="splitjoinBody" s:generic="body"/>
    <s:alias val="$_join_"/>
    <g s:x="5" s:y="20"  s:pid="out"/>
    <g transform="translate(0, 10)" s:x="0" s:y="10" s:pid="in0">
      <text x="-3" y="-4" class="inputPortLabel">hi:lo</text>
    </g>
    <g transform="translate(0, 30)" s:x="0" s:y="30" s:pid="in1">
      <text x="-3" y="-4" class="inputPortLabel">hi:lo</text>
    </g>
  </g>

  <g s:type="generic" transform="translate(550,250)" s:width="30" s:height="40">
    <text x="15" y="-4" class="nodelabel $cell_id" s:attribute="ref">generic</text>
    <rect width="30" height="40" s:generic="body" style="fill:#ff4dd2;fill-opacity:0.30" class="$cell_id"/>

    <g transform="translate(30, 10)" s:x="30" s:y="10" s:pid="out0">
      <text x="5" y="-4" style="fill:#000; stroke:none" class="$cell_id">out0</text>
    </g>
    <g transform="translate(30, 30)" s:x="30" s:y="30" s:pid="out1">
      <text x="5" y="-4" style="fill:#000;stroke:none" class="$cell_id">out1</text>
    </g>
    <g transform="translate(0, 10)" s:x="0" s:y="10" s:pid="in0">
      <text x="-3" y="-4" class="inputPortLabel $cell_id">in0</text>
    </g>
    <g transform="translate(0, 30)" s:x="0" s:y="30" s:pid="in1">
      <text x="-3" y="-4" class="inputPortLabel $cell_id">in1</text>
    </g>
  </g>


  <!-- ===================== RDS additions ===================== -->

  <!-- $pmux: one-hot case mux. A = default, B = all cases concatenated,
       S = one-hot select. Deliberately NOT the 2:1 shape. -->
  <g s:type="pmux" transform="translate(50,150)" s:width="34" s:height="80">
    <s:alias val="$pmux"/>
    <path d="M0,0 L34,14 L34,66 L0,80 Z" style="stroke-width:2.5" class="$cell_id"/>
    <text x="17" y="36" class="nodelabel $cell_id" style="font-size:9px">1-hot</text>
    <text x="17" y="48" class="nodelabel $cell_id" style="font-size:8px">case</text>
    <g s:x="0"  s:y="14" s:pid="A"/>
    <g s:x="0"  s:y="52" s:pid="B"/>
    <g s:x="17" s:y="76" s:pid="S"/>
    <g s:x="34" s:y="40" s:pid="Y"/>
  </g>

  <!-- $mux-bus: netlistsvg appends -bus when WIDTH>1. Heavy stroke = datapath. -->
  <g s:type="mux-bus" transform="translate(120,150)" s:width="24" s:height="48">
    <s:alias val="$mux-bus"/>
    <path d="M0,0 L24,12 L24,36 L0,48 Z" style="stroke-width:2.5" class="$cell_id"/>
    <g s:x="0"  s:y="12" s:pid="A"/>
    <g s:x="0"  s:y="36" s:pid="B"/>
    <g s:x="12" s:y="43" s:pid="S"/>
    <g s:x="24" s:y="24" s:pid="Y"/>
  </g>

  <!-- $adff: ASYNC-reset flop. Double left edge + ARST marked, so an async
       reset is visible without reading the label. -->
  <g s:type="adff" transform="translate(200,150)" s:width="34" s:height="44">
    <s:alias val="$adff"/>
    <s:alias val="$adffe"/>
    <s:alias val="$dffsr"/>
    <rect width="34" height="44" x="0" y="0" style="stroke-width:2.5" class="$cell_id"/>
    <path d="M0,38 L6,33 L0,28" class="$cell_id"/>
    <path d="M3,3 L3,41" style="stroke-dasharray:3,2" class="$cell_id"/>
    <text x="17" y="16" class="nodelabel $cell_id" style="font-size:8px">aRST</text>
    <g s:x="34" s:y="12" s:pid="Q"/>
    <g s:x="0"  s:y="33" s:pid="CLK"/>
    <g s:x="0"  s:y="12" s:pid="D"/>
    <g s:x="0"  s:y="22" s:pid="ARST"/>
  </g>

  <!-- $sdff / $dffe: sync reset / clock enable -->
  <g s:type="sdff" transform="translate(250,150)" s:width="34" s:height="44">
    <s:alias val="$sdff"/>
    <s:alias val="$sdffe"/>
    <s:alias val="$sdffce"/>
    <s:alias val="$dffe"/>
    <rect width="34" height="44" x="0" y="0" class="$cell_id"/>
    <path d="M0,38 L6,33 L0,28" class="$cell_id"/>
    <text x="17" y="16" class="nodelabel $cell_id" style="font-size:8px">sRST</text>
    <g s:x="34" s:y="12" s:pid="Q"/>
    <g s:x="0"  s:y="33" s:pid="CLK"/>
    <g s:x="0"  s:y="12" s:pid="D"/>
    <g s:x="0"  s:y="22" s:pid="SRST"/>
    <g s:x="0"  s:y="22" s:pid="EN"/>
  </g>

  <!-- comparators: $eqx is the 4.8% one the default skin has no symbol for -->
  <g s:type="eqx" transform="translate(300,150)" s:width="28" s:height="28">
    <s:alias val="$eqx"/>
    <s:alias val="$nex"/>
    <s:alias val="$ne"/>
    <s:alias val="$le"/>
    <circle cx="14" cy="14" r="14" class="$cell_id"/>
    <text x="14" y="18" class="nodelabel $cell_id" s:attribute="ref" style="font-size:9px">==x</text>
    <g s:x="0"  s:y="8"  s:pid="A"/>
    <g s:x="0"  s:y="20" s:pid="B"/>
    <g s:x="28" s:y="14" s:pid="Y"/>
  </g>

  <!-- reductions: |A, &A, bool(A) -->
  <g s:type="reduce" transform="translate(350,150)" s:width="28" s:height="26">
    <s:alias val="$reduce_and"/>
    <s:alias val="$reduce_or"/>
    <s:alias val="$reduce_bool"/>
    <path d="M0,0 L18,0 A13,13 0 0 1 18,26 L0,26 Z" class="$cell_id"/>
    <text x="12" y="17" class="nodelabel $cell_id" s:attribute="ref" style="font-size:9px">R</text>
    <g s:x="0"  s:y="13" s:pid="A"/>
    <g s:x="28" s:y="13" s:pid="Y"/>
  </g>

  <!-- shifters: $shiftx is how a variable index into a packed vector lands -->
  <g s:type="shift" transform="translate(400,150)" s:width="32" s:height="32">
    <s:alias val="$shiftx"/>
    <s:alias val="$shift"/>
    <s:alias val="$shl"/>
    <s:alias val="$shr"/>
    <s:alias val="$sshl"/>
    <s:alias val="$sshr"/>
    <rect width="32" height="32" x="0" y="0" class="$cell_id"/>
    <path d="M6,10 L26,10 M20,5 L26,10 L20,15" class="$cell_id"/>
    <text x="16" y="27" class="nodelabel $cell_id" style="font-size:8px">shift</text>
    <g s:x="0"  s:y="10" s:pid="A"/>
    <g s:x="0"  s:y="22" s:pid="B"/>
    <g s:x="32" s:y="16" s:pid="Y"/>
  </g>

  <!-- $mul / $neg: standard ALU trapezoid, marked -->
  <g s:type="mul" transform="translate(450,150)" s:width="30" s:height="36">
    <s:alias val="$mul"/>
    <s:alias val="$div"/>
    <s:alias val="$mod"/>
    <path d="M0,0 L30,7 L30,29 L0,36 Z" style="stroke-width:2.5" class="$cell_id"/>
    <text x="15" y="22" class="nodelabel $cell_id" s:attribute="ref" style="font-size:10px">*</text>
    <g s:x="0"  s:y="9"  s:pid="A"/>
    <g s:x="0"  s:y="27" s:pid="B"/>
    <g s:x="30" s:y="18" s:pid="Y"/>
  </g>

  <g s:type="neg" transform="translate(500,150)" s:width="26" s:height="26">
    <s:alias val="$neg"/>
    <s:alias val="$pos"/>
    <path d="M0,0 L26,13 L0,26 Z" class="$cell_id"/>
    <text x="9" y="17" class="nodelabel $cell_id" style="font-size:10px">-</text>
    <g s:x="0"  s:y="13" s:pid="A"/>
    <g s:x="26" s:y="13" s:pid="Y"/>
  </g>

  <!-- memories: distinct fill so BRAM vs flops is obvious at a glance -->
  <g s:type="mem" transform="translate(550,150)" s:width="44" s:height="52">
    <s:alias val="$mem_v2"/>
    <s:alias val="$mem"/>
    <text x="22" y="-4" class="nodelabel $cell_id" s:attribute="ref">mem</text>
    <rect width="44" height="52" s:generic="body" style="fill:#ffe2b0"
          class="$cell_id"/>
  </g>

</svg>
