# Testplan for kestrel_decode
# Maps functional test scenarios to verification coverage.
# STATUS: decode truth table verified across all 45 golden encodings plus
# 6 illegal/reserved words; CSRRC/CSRRSI/CSRRCI stub forms are the one
# declared gap (DEC-11). Halt cause 3 (IALIGN) is intentionally not a decode
# scenario — decode cannot see it; it lives in kestrel_core (CORE-13).

module: kestrel_decode
rtl_file: projects/components/riscv-ip/kestrel-rv32i/rtl/fub/kestrel_decode.sv
test_file: projects/components/riscv-ip/kestrel-rv32i/dv/tests/test_kestrel_decode.py

# Module description:
# Combinational RV32I instruction decoder: a unique casez over
# {opcode, funct3, funct7} producing the datapath control bundle (alu_op,
# imm_sel, src muxes, rd_wen, dmem_req/we/size, branch/jump/jalr) plus
# halt_cause (ecall=1, ebreak=2, illegal=0xF) and csr_stub. MISC-MEM and
# SYSTEM privileged classes retire as NOPs/stubs; anything unmatched is an
# illegal-instruction halt.

parameters: []

functional_scenarios:
  - id: DEC-01
    name: "R-type arithmetic decode (10 encodings)"
    description: "Golden table R-type rows (add/sub/sll/slt/sltu/xor/srl/sra/
                  or/and): alu_op must follow funct3 with the funct7=0x20
                  split selecting SUB vs ADD and SRA vs SRL; rd_wen=1, all
                  other controls default."
    test_function: "cocotb_test_kestrel_decode"
    test_level: func
    priority: high
    status: verified
    covers_lines: [121, 122, 123, 124, 125, 126, 127, 128, 129, 130]

  - id: DEC-02
    name: "OP-IMM decode (9 encodings)"
    description: "Golden table I-type rows (addi/slti/sltiu/xori/ori/andi/
                  slli/srli/srai): imm_sel=I and alu_src_b_imm=1 on every row;
                  the shift rows require funct7=0/0x20 (reserved funct7 is
                  covered by DEC-12)."
    test_function: "cocotb_test_kestrel_decode"
    test_level: func
    priority: high
    status: verified
    covers_lines: [133, 134, 135, 136, 137, 138, 139, 140, 141]

  - id: DEC-03
    name: "LOAD decode (5 encodings, size/sign in dmem_size)"
    description: "lb/lh/lw/lbu/lhu: dmem_req=1 with dmem_size = 0/1/2/0/1
                  (lbu/lhu alias the size of lb/lh; sign handling is a
                  kestrel_core writeback concern), alu_op=ADD, imm_sel=I,
                  rd_wen=1."
    test_function: "cocotb_test_kestrel_decode"
    test_level: func
    priority: high
    status: verified
    covers_lines: [144, 145, 146, 147, 148]

  - id: DEC-04
    name: "STORE decode (3 encodings)"
    description: "sb/sh/sw: dmem_req=1, dmem_we=1, dmem_size=0/1/2,
                  imm_sel=S, alu_src_b_imm=1, no rd_wen."
    test_function: "cocotb_test_kestrel_decode"
    test_level: func
    priority: high
    status: verified
    covers_lines: [151, 152, 153]

  - id: DEC-05
    name: "BRANCH decode (6 encodings)"
    description: "beq/bne/blt/bge/bltu/bgeu: branch=1, imm_sel=B,
                  alu_src_a_pc=1, alu_src_b_imm=1, alu_op=ADD (pc+imm target);
                  the condition select itself lives in kestrel_core."
    test_function: "cocotb_test_kestrel_decode"
    test_level: func
    priority: high
    status: verified
    covers_lines: [156, 157, 158, 159, 160, 161]

  - id: DEC-06
    name: "JAL / JALR / LUI / AUIPC decode"
    description: "jal (imm_sel=J, jump=1, src_a=pc), jalr (imm_sel=I, jalr=1),
                  lui (imm_sel=U), auipc (imm_sel=U, src_a=pc): all rd_wen=1,
                  alu_src_b_imm=1."
    test_function: "cocotb_test_kestrel_decode"
    test_level: func
    priority: high
    status: verified
    covers_lines: [164, 165, 166, 167]

  - id: DEC-07
    name: "ECALL / EBREAK halt decode (causes 1 / 2)"
    description: "SYSTEM funct3=000 with imm12=0x000/0x001: halt_cause must be
                  HALT_ECALL(1)/HALT_EBREAK(2) with every datapath control at
                  its default (no rd write, no dmem request)."
    test_function: "cocotb_test_kestrel_decode"
    test_level: gate
    priority: high
    status: verified
    covers_lines: [172, 173, 174, 175]

  - id: DEC-08
    name: "FENCE / FENCE.I retire-as-NOP decode"
    description: "MISC-MEM funct3=000/001 (fence iorw,iorw and fence.i): the
                  control bundle must stay entirely default — no rd_wen, no
                  dmem_req, no halt — so the instructions retire as NOPs."
    test_function: "cocotb_test_kestrel_decode"
    test_level: func
    priority: high
    status: verified
    covers_lines: [195, 196]

  - id: DEC-09
    name: "MRET falls through to pc+4"
    description: "SYSTEM funct3=000 imm12=0x302: default bundle with
                  halt_cause=HALT_NONE — mret retires as a NOP (the riscv-tests
                  p-env points mepc at the next instruction)."
    test_function: "cocotb_test_kestrel_decode"
    test_level: func
    priority: medium
    status: verified
    covers_lines: [176]

  - id: DEC-10
    name: "CSR-stub class, implemented funct3 forms"
    description: "csrrw / csrrwi / csrr (CSRRS with rs1=x0) rows of the golden
                  table: csr_stub=1 with rd_wen=1 — kestrel has no CSR state,
                  so the class retires through a zero writeback (reads return
                  zero, writes drop)."
    test_function: "cocotb_test_kestrel_decode"
    test_level: func
    priority: high
    status: verified
    covers_lines: [185, 186, 187, 188, 189, 190]

  - id: DEC-11
    name: "CSR-stub class, remaining funct3 forms (CSRRC / CSRRSI / CSRRCI)"
    description: "Declared gap: the golden table covers CSRRW/CSRRS/CSRRWI;
                  CSRRC, CSRRSI and CSRRCI share the identical
                  csr_stub=1 + rd_wen=1 arm in RTL but have no golden-table
                  row today. Planned as additional DECODE_GOLDEN entries."
    test_function: "cocotb_test_kestrel_decode (csr_f3_forms)"
    test_level: func
    priority: low
    status: not_implemented

  - id: DEC-12
    name: "Illegal and reserved encodings halt with cause 0xF"
    description: "ILLEGAL_WORDS (0x00000000, 0xFFFFFFFF) plus RESERVED_WORDS
                  (SYSTEM funct3=100, wfi imm12=0x105, MISC-MEM funct3=2,
                  sll with funct7=0x01): the full control bundle must equal the
                  default with halt_cause=HALT_ILL(0xF) — every field checked,
                  not just the halt cause."
    test_function: "cocotb_test_kestrel_decode"
    test_level: gate
    priority: high
    status: verified
    covers_lines: [119, 199, 200, 201]

parameter_coverage: []

implied_coverage:
  total_scenarios: 12
  scenario_tracked: 11
  implied_covered: 11
  implied_percentage: 91.7

notes: |
  `cocotb_test_kestrel_decode` lives in test_kestrel_decode.py and is
  selected from DUT_CASES ("kestrel_decode", toplevel=kestrel_decode);
  gate/func/full cells all pass under
  dv/tests/local_sim_build/cocotb_test_kestrel_decode_{gate,func,full}/.

  Table size: DECODE_GOLDEN holds 45 encodings — the 37 canonical RV32I
  integer instructions, plus mret, fence, fence.i, ecall, ebreak, and 3
  CSR-stub forms (csrrw/csrrwi/csrr). Instruction words were assembled with
  riscv-none-elf-as -march=rv32i (see the golden-table header comment).

  Split honesty: DEC-10 is verified only for the three funct3 forms with
  golden rows; DEC-11 carries the remaining three forms even though the RTL
  arm is shared — the test does not drive them today.

  Cause 3 (HALT_IALIGN, misaligned taken control-flow target) is deliberately
  absent from this plan: kestrel_decode cannot see the resolved next PC, so
  the core raises it (kestrel_core.sv, misalign_target). That coverage is
  claimed in kestrel_core_testplan.yaml (CORE-13), verified by
  cocotb_test_kestrel_rv32ui_system.
