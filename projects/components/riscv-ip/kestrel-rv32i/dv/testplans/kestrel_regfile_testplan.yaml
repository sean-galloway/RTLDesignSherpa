# Testplan for kestrel_regfile
# Maps functional test scenarios to verification coverage.
# STATUS: unit scenarios verified at gate/func/full via one cocotb test;
# independent dual-port addressing is verified at core level (see RF-05).

module: kestrel_regfile
rtl_file: projects/components/riscv-ip/kestrel-rv32i/rtl/fub/kestrel_regfile.sv
test_file: projects/components/riscv-ip/kestrel-rv32i/dv/tests/test_kestrel_regfile.py

# Module description:
# Thirty-two-entry RV32I register file with two combinational read ports
# (rs1/rs2) and one synchronous write port (rd) that discards writes to x0.
# Reset clears every entry to zero.

parameters: []

functional_scenarios:
  - id: RF-01
    name: "Synchronous reset clears all entries"
    description: "Assert rst_n for two cycles, release, then read all 32
                  addresses on both ports: every entry must read 0."
    test_function: "cocotb_test_kestrel_regfile"
    test_level: gate
    priority: high
    status: verified
    covers_lines: [39, 40, 41, 42, 43]

  - id: RF-02
    name: "Write-then-read back on both read ports"
    description: "Write random 32-bit data to 10 random registers (SEED-driven),
                  then read each back on rs1 and rs2: both ports must return
                  the written value."
    test_function: "cocotb_test_kestrel_regfile"
    test_level: func
    priority: high
    status: verified
    covers_lines: [45, 46, 51, 52]

  - id: RF-03
    name: "Read-during-write returns the old value"
    description: "Present rd_wen=1 with new data while reading the same
                  address combinationally: rs1/rs2 must show the OLD value in
                  the write cycle and the NEW value the cycle after."
    test_function: "cocotb_test_kestrel_regfile"
    test_level: func
    priority: high
    status: verified
    covers_lines: [45, 46, 51, 52]

  - id: RF-04
    name: "Writes to x0 are discarded"
    description: "Write 0xDEADBEEF to register 0, read x0 back on both ports:
                  data must still be 0 (write guard rd_addr != X0_ADDR)."
    test_function: "cocotb_test_kestrel_regfile"
    test_level: gate
    priority: high
    status: verified
    covers_lines: [45, 46]

  - id: RF-05
    name: "Independent rs1/rs2 addressing (rs1 != rs2)"
    description: "The unit test drives the same address on both read ports;
                  independent-port addressing is exercised at core level: the
                  RV32I ops golden-trace diff checks rvfi_rs1/rs2_addr +
                  rvfi_rs1/rs2_rdata on every beat with arbitrary register
                  pairs."
    test_function: "cocotb_test_kestrel_core_ops"
    test_level: func
    priority: medium
    status: verified
    covers_lines: [51, 52]

parameter_coverage: []

implied_coverage:
  total_scenarios: 5
  scenario_tracked: 5
  implied_covered: 5
  implied_percentage: 100.0

notes: |
  Single cocotb test (`cocotb_test_kestrel_regfile`) covers RF-01..RF-04 and
  is compiled standalone (`toplevel=kestrel_regfile`) per gate/func/full cell
  (REG_LEVEL grid); only the SEED varies between cells. All three levels are
  built and passing under dv/tests/local_sim_build/ (test_kestrel_regfile_*).

  RF-05 is honestly attributed: the unit test always addresses both read ports
  with the same index, so independent-address behavior is claimed from the
  core-level golden trace (rv32ui_ops.hex diffs rs1/rs2 addr AND rdata per
  beat), not from this block's unit test.

  No parameters: the register file is parameterized only by localparams
  (REG_COUNT=32, X0_ADDR=0).
