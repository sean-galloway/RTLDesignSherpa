# Testplan for alu_infer_top (covers the full alu-infer pipeline:
# top + rows + pipe + acc -- one inseparable unit tested via the top)
# Maps functional test scenarios to Verilator coverage points.
#
# GENERATED FROM REAL COVERAGE DATA: per-scenario coverage.dat files
# (COVERAGE=1 make run-all-func-parallel) are merged and annotated;
# covers_lines are that scenario's covered lines in
# verilator_coverage --annotate numbering -- the same semantics
# bin/cov_utils/verify_testplan_coverage.py checks with. Regenerate
# with the same flow when the RTL or tests change.

module: alu_infer_top
rtl_files:
  - projects/components/compute-eng-ip/alu-infer/rtl/alu_infer_top.sv
  - projects/components/compute-eng-ip/alu-infer/rtl/alu_infer_rows.sv
  - projects/components/compute-eng-ip/alu-infer/rtl/alu_infer_pipe.sv
  - projects/components/compute-eng-ip/alu-infer/rtl/alu_infer_acc.sv
test_file: projects/components/compute-eng-ip/alu-infer/dv/tests/test_alu_infer.py

# Module description:
# BF16 inference ALU at the cell execution-FSM seam. One GAXI-style
# valid/ready issue interface (op lines, func_sel, acc_ctrl), one
# valid/ready result interface. Elastic pipeline: comb rows retire the
# cycle after issue, the pipelined adder row after ADDER_LATENCY, MAC
# drains on acc_ctrl; an 8-bit tag FIFO joins ops that must align.

parameters:
  - name: LINE_W
    default: 32
    description: Operand line width (2 x BF16 lanes)
  - name: N_LANES
    default: 2
    description: BF16 lanes per line (LINE_W/16)
  - name: ACC_W
    default: 32
    description: FP32 accumulator width
  - name: PIPE_DEPTH
    default: 8
    description: In-flight bound (tag FIFO depth); tested at 4 and 8
  - name: ADDER_LATENCY
    default: 3
    description: Pipelined adder row latency (0-4)
  - name: TAG_W
    default: 8
    description: Alignment tag width

