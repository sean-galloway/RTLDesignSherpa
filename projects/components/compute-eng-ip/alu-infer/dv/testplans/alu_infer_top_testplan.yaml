test_file: projects/components/compute-eng-ip/alu-infer/dv/tests/test_alu_infer.py

# Module description:
# Inference ALU at the cell issue seam (driven by gatling). bf16, int8,
# fp32 and fp8 element formats on func_sel[8:7]. One GAXI-style
# valid/ready issue interface (op lines, func_sel, acc_ctrl), one
# valid/ready result interface. Elastic pipeline: four result ports
# (comb, adder, multiplier, accumulator), each at its natural latency,
# joined in issue order by an 8-bit tag FIFO.

parameters:
  - name: LINE_W
    default: 32
    description: Operand line width (2 x BF16 lanes)
  - name: N_LANES
    default: 2
    description: BF16 lanes per line (LINE_W/16)
  - name: ACC_W
    default: 32
    description: FP32 accumulator width
  - name: PIPE_DEPTH
    default: 8
    description: In-flight bound (tag FIFO depth); tested at 4 and 8
  - name: ADDER_LATENCY
    default: 3
    description: bf16/fp32 adder row latency (0-4); tested at 0, 3, 4
  - name: MUL_LATENCY
    default: 0
    description: bf16/fp32 multiplier row output stages (0-4); tested at 0, 2
  - name: MAC_LATENCY
    default: 0
    description: Operand stages ahead of the accumulate stage (0-4); tested at 0, 2
  - name: EN_INT8 / EN_FP32 / EN_FP8 / EN_REDUCE / EN_PWL / EN_ACT / EN_CVT
    default: 1
    description: Build-out switches; each tested off in the lean build
  - name: TAG_W
    default: 8
    description: Alignment tag width

