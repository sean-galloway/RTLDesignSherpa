# Testplan for hive_c_loader (Block 1: vexriscv_wrapper + memories + loader)
# STATUS: planned — RTL not written yet (Phase 1 bring-up, per HAS ch7 roadmap).

module: hive_c_loader
rtl_file: projects/components/compute-eng-ip/hive-serv/rtl/hive_c_controller/hive_c_loader.sv (PLANNED - RTL not written yet, vault hive-serv TASK-000)
test_file: projects/components/compute-eng-ip/hive-serv/dv/tests/test_hive_c_loader.py

# Module description:
# Integration of the vendored VexRiscv "Small-class" RV32IM core
# (vendor/vexriscv, generated by bin/generate_hive_cores.sh) with the two
# 32 KB tightly-coupled BRAM memories, plus the kestrel-pattern board
# loader: an AXI4-Lite slave window into both memories with load-then-run
# control (HAS §5.1, MAS §2.2 decision 2026-10-13: kestrel loader pattern).

parameters: []

functional_scenarios:
  - id: LDR-01
    name: "Reset hold and staged release"
    description: "Out of reset the core is held (hive_c_rst_n low into the
                  wrapper); the loader's run bit gates core reset release.
                  Verify no ibus/dbus activity while held, first ibus cmd
                  at 0x0000_0000 after release."
    test_function: "cocotb_test_hive_c_loader"
    test_level: gate
    priority: high
    status: planned

  - id: LDR-02
    name: "AXIL window writes and reads back both memories"
    description: "Word writes via the AXIL slave land in I-mem (0x0000_0000
                  region) and D-mem (0x0000_8000 region) and read back
                  identically; sub-word strobes behave; out-of-window
                  addresses return SLVERR per the loader address map."
    test_function: "cocotb_test_hive_c_loader"
    test_level: func
    priority: high
    status: planned

  - id: LDR-03
    name: "Load-then-run handoff"
    description: "Load a small RV32IM program (assembled addi/jal/store
                  sequence with M-extension ops) over AXIL, flip run, and
                  observe the core execute: ibus fetch sequence matches the
                  program counter progression and a D-mem write of the
                  expected result value appears on the dbus."
    test_function: "cocotb_test_hive_c_loader"
    test_level: func
    priority: high
    status: planned

  - id: LDR-04
    name: "Ibus/dbus arbitration: loader port vs core port"
    description: "While the core is held, loader AXIL accesses have the
                  memory ports; during run, the core owns them and loader
                  writes are blocked (or serialized per the documented
                  arbitration). Verify no port corruption on the switch."
    test_function: "cocotb_test_hive_c_loader"
    test_level: func
    priority: medium
    status: planned

  - id: LDR-05
    name: "M-extension smoke on the generated core"
    description: "Program exercises mul/div via MulDivIterativePlugin and
                  stores results; golden compares against Python ints.
                  Confirms the generated RV32IM netlist matches the pinned
                  HiveCGen configuration."
    test_function: "cocotb_test_hive_c_loader"
    test_level: gate
    priority: high
    status: planned
