# Testplan for jet_control (lookup stage + commit pipeline + snoop path)
# Maps the MAS ch02_blocks/01 + ch02_blocks/05 contract to the Pattern-B
# grid DV: directed scenarios for the four-class classify (HIT / MERGE /
# MISS_ALLOC / STALL with the J6 sub-reasons), hit-under-miss (J2), the
# merge join (J3), the W-port arbitration, the commit pipeline (D-4 store
# merge, tag install with the amber #106 PassDirty rule, deferred snoop
# effect after the install, per-tag deposits in tag order, entry retire),
# and the snoop path under concurrency (the three answer sources -- WB
# snarf incl. the BRESP-cycle race, the pending-fill bypass with PF_GUARD,
# the array hit -- the bounded anti-livelock hold-off, and snoop priority
# over new CPU accepts) run against the REAL l1_tag_array / l1_data_array
# / l1_repl / jet_mshr / jet_wb_buffer / jet_rsp_seq with fill/drain
# engines as handshake-timing-only stubs (the fill stub accepts launches
# promptly and serves bursts serially in launch order -- the
# single-AXI4-ID contract) and the TB driving the l1_snoop_resp
# core-facing snoop contract directly.  Single geometry cell
# (MSHR_COUNT=8, VICTIM_DEPTH=2, SETS=128, WAYS=4); the J7 sweeps are
# experiments, not unit-TB cells.  GATE runs the full scenario set once;
# FUNC repeats it with perturbed fill/drain stub latencies plus CD
# backpressure mid-stream (timing robustness of the launch-hold,
# stall-release, commit/lookup port-arbitration, and snoop-service paths).

module: jet_control
rtl_files:
  - projects/components/cache-ip/jet-mesi-l1/rtl/fub/jet_control.sv
test_files:
  - projects/components/cache-ip/jet-mesi-l1/dv/tests/test_jet_control.py

# Contract: MAS ch02_blocks/01 + ch02_blocks/05.  One request, one window:
# tag read (port A) + MSHR CAM + WB match + set claim count classify in
# the same cycle; one fill completion at a time: D-4 merge, tag install,
# deferred snoop effect, response deposits, retire.  One snoop at a time:
# the grant-cycle CRRESP resolves the three answer sources (WB snarf >
# pending-fill bypass > array port B), the CD stream serves the selected
# source (the WB from a grant-cycle snapshot), and the state effect lands
# at the effect slot (tag write / pend_eff record with I-sticks / WB
# record).

parameters:
  - name: ADDR_WIDTH / SETS / WAYS / LINE_BYTES / BUS_WIDTH
    default: l1_pkg defaults (32/128/4/64/64)
    description: geometry, shared with the arrays
  - name: MSHR_COUNT
    default: jet_pkg.MSHR_COUNT (8)
    description: outstanding misses (J1); forwarded to jet_mshr
  - name: VICTIM_DEPTH
    default: jet_pkg.VICTIM_DEPTH (2)
    description: WB buffer rows (J5); forwarded to jet_wb_buffer

scenarios:
  - name: hit_read
    level: all
    what: A resident line serves a read hit while a miss is outstanding
      (J2) -- accepted the presenting cycle, deposit lands immediately, the
      release waits behind the miss's tag (J4), both release in order after
      the commit.
    status: covered
  - name: hit_write
    level: all
    what: Write hits merge through the W port with the E->M promotion tag
      write (suppressed when already M), and proceed while a miss is
      outstanding (J2).  Read-back checks the merged bytes.
    status: covered
  - name: miss_alloc
    level: all
    what: A miss allocates an MSHR entry, claims the victim way (repl_req +
      repl_update, LRU-model parity), launches the fill, and is not held.
      After the commit the line serves hits.
    status: covered
  - name: merge_read_onto_ru
    level: all
    what: A read miss matching an outstanding write fill (RU) joins the
      entry's merge list (J3) -- no new alloc, no new fill; both requesters
      get exactly one response, in tag order, at the commit.
    status: covered
  - name: stall_cross_class
    level: all
    what: A write miss behind an outstanding RNSD fill stalls
      cross_class_wait (no alloc, no fill) until the fill commits, then
      proceeds as an upgrade (J3); the CLEAN_UNIQUE commits through the CU
      path (held write merged, tag installs M, echo deposit) and the
      merged data reads back.
    status: covered
  - name: stall_mshr_full
    level: all
    what: MSHR_COUNT allocs fill the file (fills slowed so all entries
      stay live to the cap); the next miss stalls mshr_full until the
      first fill's commit retires an entry (bounded release).
    status: covered
  - name: stall_wb_full_only_dirty
    level: all
    what: WB-full stalls ONLY new dirty-victim misses (J6): a clean-victim
      miss allocates freely with the WB full; the dirty-victim miss stalls
      wb_full_dirty_victim until a drain completes.  The capture payload is
      checked end-to-end at the drain head (addr + data, oldest first).
    status: covered
  - name: stall_wb_drain_race
    level: all
    what: A miss whose line sits in the WB buffer (a dirty victim
      mid-capture / awaiting drain) stalls wb_full_dirty_victim until the
      drain completes (Chinnakonda 10.10.1 -- the refetch must not race
      the outstanding writeback); the refetched line's commit returns the
      drained (dirty) data.
    status: covered
  - name: stall_set_oversubscribed
    level: all
    what: WAYS outstanding claims in one set refuse a further alloc to
      that set (a different set is unaffected) until one of the set's
      entries retires.  The claim-aware victim check (a proposed victim
      way already claimed by a live entry) folds into the same reason --
      the RANDOM/LRU-reorder safety fix.
    status: covered
  - name: fill_beats_win_wport
    level: all
    what: A write hit yields the W port for a bounded 8-beat fill stream
      (lkup_wr_yield_o, no array write from control), then proceeds; a read
      hit in the same window does not yield (J2 W-port arbitration).
    status: covered
  - name: stall_tag_full
    level: all
    what: RSP_DEPTH accepted hits with rsp_ready low fill the sequencer;
      the next request stalls tag_full until a release frees a slot -- the
      freed tag is re-granted and deposited in the release's own cycle
      (the jet_rsp_seq recirculation corner).
    status: covered
  - name: init_walk
    level: all
    what: D-3 post-reset walk writes STATE_I to every way of every set, one
      set per cycle; a stray request during the walk is not accepted;
      port-B readback confirms all-Invalid.
    status: covered
  - name: commit_installs_tag
    level: all
    what: The commit installs the entry's tag with the install state --
      S for an RNSD fill without PassDirty, M when PassDirty was received
      (amber #106), M for a write (RU) fill.  The watcher scores the
      install write; a following write's classify (upgrade iff S) proves
      the installed state end-to-end.
    status: covered
  - name: commit_merges_store_data
    level: all
    what: Amber D-4 at commit: the entry's store data merges onto the
      just-filled beats with byte enables, in requester order; a read
      between two writes to the same beat sees the earlier write but not
      the later one (request order pinned by per-slot golden data); a read
      presented after fill_done stalls commit_in_progress until the retire
      and then hits the installed line; the committed line reads back
      fully merged.
    status: covered
  - name: merge_response_completeness
    level: all
    what: Allocator + 3 merged requesters + 1 cross-class waiter -> exactly
      one response per sequence tag, in tag order, in consecutive cycles
      at the deposit port (the watcher pins order/adjacency/no-double);
      the waiter proceeds as an upgrade after the commit; all five
      responses release in J4 order.
    status: covered
  - name: commit_retires_entry
    level: all
    what: The commit retires the MSHR entry (occupancy returns to 0), frees
      the entry (the next alloc reuses the lowest free index) and the
      victim-way claim; both committed lines serve hits afterwards.
    status: covered
  - name: pend_eff_applied_after_install
    level: all
    what: A snoop hitting an in-flight entry records its post-commit
      effect through the REAL snoop service (downgrade-S on an RU fill's M
      install, invalidate-I on an RNSD fill's S install) and the commit
      lands it AFTER the tag install -- the watcher pins the two-write
      order; the post-commit classify proves the final state (the
      downgraded line upgrades on a write; the invalidated line misses
      again).
    status: covered
  - name: snoop_hit_pending_entry
    level: all
    what: A snoop matching an in-flight MSHR entry is answered at the
      entry's post-fill install state (never the Invalid row), with CD
      from the array (the fill's claimed way) once every beat has landed;
      the effect is recorded in pend_eff.  Pins the I-sticks carried
      review item: an armed invalidate is not overwritten by a later
      downgrade (the commit's pend write must be I).
    status: covered
  - name: snoop_pf_guard
    level: all
    what: PF_GUARD (Review Focus 4): with fill beats outstanding the
      pending-fill answer suppresses DataTransfer and PassDirty and
      presents no CD beat (a snoop never waits on a fill); the answer
      keeps the post-fill row's IsShared (never the Invalid row), with
      zero beats landed included; with every beat landed the full M-row
      decode and the fill data stream.
    status: covered
  - name: snoop_snarf_bresp_race
    level: all
    what: Review Focus 3: a snoop matching a WB entry is answered from the
      buffer (SINK_WB_ACK) -- including a grant landing IN the entry's
      BRESP cycle: the grant snapshots the line, the CD stream serves the
      snapshot after the entry retires, and the drain still completes the
      memory update (the drain stub checks the payload).
    status: covered
  - name: snoop_priority
    level: all
    what: A snoop presented with a CPU request pending is served first
      (J6): the lookup stage holds the CPU request (no accept, no stall
      reason) through the grant, the CD stream, and the effect cycle, then
      accepts it; the snoop's downgrade is visible to the next classify.
    status: covered
  - name: anti_livelock_window
    level: all
    what: After a CLEAN_UNIQUE grant for line L, snoop service is held off
      exactly until the granted write's commit lands -- the window is
      measured in cycles (the grant cycle itself through the commit's
      pop; <= 6 with nothing queued) -- then a snoop is served at the
      committed M with the held write merged.
    status: covered
  - name: snoop_never_waits_on_wb_full
    level: all
    what: Snoop acceptance and service never gate on WB occupancy or drain
      state: with the WB full and the drains held, snoops to a resident
      line (array), a WB-buffered line (snarf), and an absent line are all
      granted immediately and answered correctly.
    status: covered

