# Testplan for jet_control (lookup stage + commit pipeline)
# Maps the MAS ch02_blocks/01 contract to the Pattern-B grid DV: directed
# scenarios for the four-class classify (HIT / MERGE / MISS_ALLOC / STALL
# with the J6 sub-reasons), hit-under-miss (J2), the merge join (J3), the
# W-port arbitration, and the commit pipeline (D-4 store merge, tag
# install with the amber #106 PassDirty rule, deferred snoop effect after
# the install, per-tag deposits in tag order, entry retire) run against
# the REAL l1_tag_array / l1_data_array / l1_repl / jet_mshr /
# jet_wb_buffer / jet_rsp_seq with fill/drain engines as
# handshake-timing-only stubs (the fill stub accepts launches promptly and
# serves bursts serially in launch order -- the single-AXI4-ID contract).
# Single geometry cell (MSHR_COUNT=8, VICTIM_DEPTH=2, SETS=128, WAYS=4);
# the J7 sweeps are experiments, not unit-TB cells.  GATE runs the full
# scenario set once; FUNC repeats it with perturbed fill/drain stub
# latencies (timing robustness of the launch-hold, stall-release, and
# commit/lookup port-arbitration paths).

module: jet_control
rtl_files:
  - projects/components/cache-ip/jet-mesi-l1/rtl/fub/jet_control.sv
test_files:
  - projects/components/cache-ip/jet-mesi-l1/dv/tests/test_jet_control.py

# Contract: MAS ch02_blocks/01.  One request, one window: tag read (port A)
# + MSHR CAM + WB match + set claim count classify in the same cycle; one
# fill completion at a time: D-4 merge, tag install, deferred snoop
# effect, response deposits, retire.  The snoop responder is Task 7 (the
# TB drives the deferred-effect record directly into jet_mshr, mid-fill).

parameters:
  - name: ADDR_WIDTH / SETS / WAYS / LINE_BYTES / BUS_WIDTH
    default: l1_pkg defaults (32/128/4/64/64)
    description: geometry, shared with the arrays
  - name: MSHR_COUNT
    default: jet_pkg.MSHR_COUNT (8)
    description: outstanding misses (J1); forwarded to jet_mshr
  - name: VICTIM_DEPTH
    default: jet_pkg.VICTIM_DEPTH (2)
    description: WB buffer rows (J5); forwarded to jet_wb_buffer

scenarios:
  - name: hit_read
    level: all
    what: A resident line serves a read hit while a miss is outstanding
      (J2) -- accepted the presenting cycle, deposit lands immediately, the
      release waits behind the miss's tag (J4), both release in order after
      the commit.
    status: covered
  - name: hit_write
    level: all
    what: Write hits merge through the W port with the E->M promotion tag
      write (suppressed when already M), and proceed while a miss is
      outstanding (J2).  Read-back checks the merged bytes.
    status: covered
  - name: miss_alloc
    level: all
    what: A miss allocates an MSHR entry, claims the victim way (repl_req +
      repl_update, LRU-model parity), launches the fill, and is not held.
      After the commit the line serves hits.
    status: covered
  - name: merge_read_onto_ru
    level: all
    what: A read miss matching an outstanding write fill (RU) joins the
      entry's merge list (J3) -- no new alloc, no new fill; both requesters
      get exactly one response, in tag order, at the commit.
    status: covered
  - name: stall_cross_class
    level: all
    what: A write miss behind an outstanding RNSD fill stalls
      cross_class_wait (no alloc, no fill) until the fill commits, then
      proceeds as an upgrade (J3); the CLEAN_UNIQUE commits through the CU
      path (held write merged, tag installs M, echo deposit) and the
      merged data reads back.
    status: covered
  - name: stall_mshr_full
    level: all
    what: MSHR_COUNT allocs fill the file (fills slowed so all entries
      stay live to the cap); the next miss stalls mshr_full until the
      first fill's commit retires an entry (bounded release).
    status: covered
  - name: stall_wb_full_only_dirty
    level: all
    what: WB-full stalls ONLY new dirty-victim misses (J6): a clean-victim
      miss allocates freely with the WB full; the dirty-victim miss stalls
      wb_full_dirty_victim until a drain completes.  The capture payload is
      checked end-to-end at the drain head (addr + data, oldest first).
    status: covered
  - name: stall_wb_drain_race
    level: all
    what: A miss whose line sits in the WB buffer (a dirty victim
      mid-capture / awaiting drain) stalls wb_full_dirty_victim until the
      drain completes (Chinnakonda 10.10.1 -- the refetch must not race
      the outstanding writeback); the refetched line's commit returns the
      drained (dirty) data.
    status: covered
  - name: stall_set_oversubscribed
    level: all
    what: WAYS outstanding claims in one set refuse a further alloc to
      that set (a different set is unaffected) until one of the set's
      entries retires.  The claim-aware victim check (a proposed victim
      way already claimed by a live entry) folds into the same reason --
      the RANDOM/LRU-reorder safety fix.
    status: covered
  - name: fill_beats_win_wport
    level: all
    what: A write hit yields the W port for a bounded 8-beat fill stream
      (lkup_wr_yield_o, no array write from control), then proceeds; a read
      hit in the same window does not yield (J2 W-port arbitration).
    status: covered
  - name: stall_tag_full
    level: all
    what: RSP_DEPTH accepted hits with rsp_ready low fill the sequencer;
      the next request stalls tag_full until a release frees a slot -- the
      freed tag is re-granted and deposited in the release's own cycle
      (the jet_rsp_seq recirculation corner).
    status: covered
  - name: init_walk
    level: all
    what: D-3 post-reset walk writes STATE_I to every way of every set, one
      set per cycle; a stray request during the walk is not accepted;
      port-B readback confirms all-Invalid.
    status: covered
  - name: commit_installs_tag
    level: all
    what: The commit installs the entry's tag with the install state --
      S for an RNSD fill without PassDirty, M when PassDirty was received
      (amber #106), M for a write (RU) fill.  The watcher scores the
      install write; a following write's classify (upgrade iff S) proves
      the installed state end-to-end.
    status: covered
  - name: commit_merges_store_data
    level: all
    what: Amber D-4 at commit: the entry's store data merges onto the
      just-filled beats with byte enables, in requester order; a read
      between two writes to the same beat sees the earlier write but not
      the later one (request order pinned by per-slot golden data); a read
      presented after fill_done stalls commit_in_progress until the retire
      and then hits the installed line; the committed line reads back
      fully merged.
    status: covered
  - name: merge_response_completeness
    level: all
    what: Allocator + 3 merged requesters + 1 cross-class waiter -> exactly
      one response per sequence tag, in tag order, in consecutive cycles
      at the deposit port (the watcher pins order/adjacency/no-double);
      the waiter proceeds as an upgrade after the commit; all five
      responses release in J4 order.
    status: covered
  - name: commit_retires_entry
    level: all
    what: The commit retires the MSHR entry (occupancy returns to 0), frees
      the entry (the next alloc reuses the lowest free index) and the
      victim-way claim; both committed lines serve hits afterwards.
    status: covered
  - name: pend_eff_applied_after_install
    level: all
    what: A snoop recording a deferred effect mid-fill (downgrade-S on a
      PassDirty install, invalidate-I on an S install) sees it land AFTER
      the tag install -- the watcher pins the two-write order; the
      post-commit classify proves the final state (the downgraded line
      upgrades on a write; the invalidated line misses again).
    status: covered

coverage_points:
  - line: 336
    type: initial
    content: "elaboration geometry checks"
    covered: true
    note: elaborates clean at the default geometry; the $error branches
      fire only on an out-of-range elaboration (by design not exercised).
  - line: 473
    type: always_comb
    content: "tag hit decode (S/E/M compare, amber LOOKUP semantics)"
    covered: true
    tests: [hit_read, hit_write, miss_alloc]
  - line: 499
    type: always_comb
    content: "pending-fill hazard (claimed-way hit suppression)"
    covered: true
    tests: [miss_alloc, stall_wb_full_only_dirty, stall_wb_drain_race]
  - line: 551
    type: always_comb
    content: "claim-aware victim check (RANDOM/LRU-reorder safety)"
    covered: true
    note: exercised implicitly by every alloc while a claim is live in
      the same set; the no-double-claim assertion pins it.
    tests: [stall_set_oversubscribed, stall_mshr_full]
  - line: 675
    type: always_comb
    content: "the four-class classify + stall sub-reason priority (incl. commit_in_progress and the upgrade-line wait)"
    covered: true
    tests: [hit_read, hit_write, miss_alloc, merge_read_onto_ru,
            stall_cross_class, stall_mshr_full, stall_wb_full_only_dirty,
            stall_wb_drain_race, stall_set_oversubscribed, stall_tag_full,
            merge_response_completeness]
  - line: 700
    type: always_comb
    content: "write-hit W-port yield (fill beats > commit merge > write hits)"
    covered: true
    tests: [fill_beats_win_wport, commit_merges_store_data]
  - line: 802
    type: always_comb
    content: "fill launch hold register (start held until fill_accept_i)"
    covered: true
    tests: [miss_alloc, stall_cross_class]
  - line: 990
    type: always_ff
    content: "D-3 init walk"
    covered: true
    tests: [init_walk]
  - line: 1000
    type: always_ff
    content: "victim capture engine (port-B beat stream)"
    covered: true
    tests: [stall_wb_full_only_dirty, stall_wb_drain_race]
  - line: 1033
    type: always_ff
    content: "upgrade tracker (single-outstanding CLEAN_UNIQUE, cleared by the CU's own commit)"
    covered: true
    tests: [stall_cross_class, commit_installs_tag, pend_eff_applied_after_install]
  - line: 1049
    type: always_ff
    content: "claimed-way scoreboard set/clear (clear at the commit retire)"
    covered: true
    tests: [miss_alloc, stall_mshr_full, stall_set_oversubscribed, commit_retires_entry]
  - line: 1060
    type: always_ff
    content: "requester sideband (per-slot we/beat/be/wdata for the D-4 walk)"
    covered: true
    tests: [commit_merges_store_data, merge_response_completeness]
  - line: 1079
    type: always_ff
    content: "fill-completion queue (push at accept, done mark, pop at retire)"
    covered: true
    tests: [all]
  - line: 1117
    type: always_ff
    content: "commit FSM (snapshot, D-4 merge + read capture, install, pend, deposits, retire; CU tail)"
    covered: true
    tests: [commit_installs_tag, commit_merges_store_data,
            merge_response_completeness, commit_retires_entry,
            pend_eff_applied_after_install, stall_cross_class]
  - line: 1211
    type: assertion
    content: "simulation-only: dirty-victim alloc always accepted by WB"
    covered: true
    tests: [stall_wb_full_only_dirty]
  - line: 1216
    type: assertion
    content: "simulation-only: a driven alloc is always granted (classify/grant consistency)"
    covered: true
    tests: [all]
  - line: 1222
    type: assertion
    content: "simulation-only: fill_done always matches an outstanding un-done fill"
    covered: true
    tests: [all]
  - line: 1229
    type: assertion
    content: "simulation-only: fill-completion queue never overflows"
    covered: true
    tests: [all]
  - line: 1235
    type: assertion
    content: "simulation-only: fill_accept only with a launch presented"
    covered: true
    tests: [all]
  - line: 1240
    type: assertion
    content: "simulation-only: fill beats land only on a live claim's entry"
    covered: true
    tests: [all]
  - line: 1246
    type: assertion
    content: "simulation-only: retire targets an entry with a live claim"
    covered: true
