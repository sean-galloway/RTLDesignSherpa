gaps:
  - Out-of-range geometry elaboration ($error) fails the build by design.
  - A snoop to the in-flight upgrade's own line before the CLEAN_UNIQUE
    grant is served at the installed S; the effect is not carried into the
    CU commit (amber's killed-upgrade replay needs a CU-commit refetch path
    jet does not have yet -- Task 8 / pair-integration territory; recorded
    in MAS ch02_blocks/01 Task 7 notes).
  - The commit-window snoop hold-off is fill-granular (any fill
    done-but-unretired blocks AC acceptance, not just the snoop's own
    line): sn_safe is necessarily address-agnostic (the transport's AC
    accept is the grant).  Bounded by the commit pipeline draining; a
    perf-only lever for J7 if the snoop latency shows.
  - Merge-list overflow (MSHR_COUNT+1 requesters on one entry) stalls
    mshr_full by construction; reaching it needs 9 live requesters on one
    line -- a FULL-level random-soak corner, not directed-tested here.
  - The unit grid runs the default LRU policy; the claim-aware victim
    check (not policy state) is what makes RANDOM/FIFO safe, and the
    no-double-claim assertion would fire in any RANDOM grid run (T12).
