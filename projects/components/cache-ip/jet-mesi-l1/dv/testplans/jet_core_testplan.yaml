# Testplan for jet_top (the pair-rig top, Task 8; FULL grid Task 12)
# Maps the MAS ch01 hierarchy + ch02 contracts to the full-core
# integration DV: jet_control + jet_mshr + jet_wb_buffer + jet_rsp_seq
# composed with the REAL common-ip slice (l1_cpu_frontend, l1_tag_array,
# l1_data_array, l1_repl, l1_fill, l1_drain, l1_snoop_resp, l1_monlite)
# and the house axi4_master_*_monlite transports + MonBus arbiter.
# Scoring is the event-stream scoreboard (JetCoreTB): amber's
# per-transaction slice checks re-based as per-line oracle lockstep at
# every snoop grant + commit, with timing as windowed properties.
# GATE/FUNC run the J1 default cell (MSHR_COUNT=8, VICTIM_DEPTH=2,
# LRU, both geometries); FULL runs the ch06/02 sign-off sweep:
# geometry {16/2, 128/4} x MSHR_COUNT {2,4,8,16} x VICTIM_DEPTH {1,2,4}
# x policy {LRU,FIFO,RANDOM} -- corners (MSHR {2,16} x VICTIM {1,4}) at
# every policy and geometry, interior sampled.

module: jet_top
rtl_files:
  - projects/components/cache-ip/jet-mesi-l1/rtl/top/jet_top.sv
test_files:
  - projects/components/cache-ip/jet-mesi-l1/dv/tests/test_jet_core.py

# Contract: MAS ch01/02 port list (amber_top shape), the ch02/01
# lookup/commit core driven by the REAL engines (fill beats through the
# monlite-wrapped AXI4 read path, drains through the write path, the WB
# head in the l1_victim shape), the ch02/05 snoop path behind the REAL
# l1_snoop_resp transport, and the Task-8 rulings: the launch-level
# cap_busy contract, the sticky CTRL_ERROR, and the killed-upgrade
# demote.

parameters:
  - name: ADDR_WIDTH / SETS / WAYS / LINE_BYTES / BUS_WIDTH
    default: l1_pkg defaults (32/128/4/64/64)
    description: geometry, shared with the arrays
  - name: MSHR_COUNT
    default: jet_pkg.MSHR_COUNT (8)
    description: outstanding misses (J1)
  - name: VICTIM_DEPTH
    default: jet_pkg.VICTIM_DEPTH (2)
    description: WB buffer rows (J5)

scenarios:
  - name: InitWalk
    level: all
    what: A request presented mid-walk is held (cpu_req_wr_ready low)
      until the D-3 walk completes, then served; the walk is bounded.
    status: covered
  - name: HitSequence
    level: all
    what: Miss/fill then read hits, the S->M upgrade (CLEAN_UNIQUE through
      the real l1_fill no-data burst), an M write hit, read-back data
      integrity -- the amber hit-sequence shape re-run on jet.
    status: covered
  - name: MissSequence
    level: all
    what: Clean and dirty evictions through the real drain engine; the
      dirty victim's writeback payload audited at drain_done against the
      capture-time snapshot; the refetch observes the writeback; a
      partial-BE write miss merges at the commit.
    status: covered
  - name: BeZeroWrite
    level: all
    what: be == 0 writes merge nothing (the line keeps the fill bytes).
    status: covered
  - name: SnoopSequence
    level: all
    what: READ_SHARED on M (DT+PD+IS, CD content from the array,
      downgrade to S), MAKE_INVALID (invalidate, refetch after),
      READ_UNIQUE on I (no transfer) -- through the real ACE transport.
    status: covered
  - name: SnoopPendingFill
    level: all
    what: Snoops to an in-flight fill's line resolve through the bypass
      at the post-fill state with PF_GUARD (no DataTransfer before every
      beat has landed); pend_eff lands after the install.
    status: covered
  - name: PendArmedDowngradeRO
    level: all
    what: "BUG-004: an in-flight write-miss fill takes READ_SHARED (arms
      pend_eff DOWNGRADE_S) then READ_ONCE; the effect chains against the
      armed S, so the fill commits S with the store merged (readback hits
      and returns the store) -- the pre-fix RTL resolved RO against the
      post-fill M, armed INVALIDATE_I, and silently dropped the store."
    status: covered
  - name: KilledUpgrade
    level: all
    what: A pre-grant MAKE_INVALID to the in-flight upgrade's line writes
      I to the tag; the CU commit demotes its install to I (never
      resurrect M -- the Task-8 fix); the write response still echoes;
      a later read re-fetches.
    status: covered
  - name: IllegalStateError
    level: all
    what: A reserved commit-FSM encoding latches the sticky CTRL_ERROR
      (ctrl_state = AMBER_CTRL_ERROR, accepts dead-stopped); only reset
      exits; the cache re-initializes and serves after.
    status: covered
  - name: ResponseTagOrder
    level: all
    what: A slow miss, a hit behind it, and a merge onto the fill
      release in issue order (J4; every release is scored against the
      issue-order head by the FIFO pop).
    status: covered
  - name: WindowedFillStart
    level: all
    what: Every alloc's fill launch lands within FILL_LAUNCH_WINDOW
      cycles, and never while a victim capture streams (the launch-level
      cap_busy contract, checked every cycle).
    status: covered
  - name: VictimClaimStall
    level: all (LRU cells; the construction needs hit reordering)
    what: The Task-6-review deferred pin.  One live claim in a set;
      send-only read hits to the other ways walk the LRU victim back
      onto the claimed way; a true miss then stalls set_oversubscribed
      with every other contributor scored absent (set-full / mshr-full /
      WB-full / capture / drain-race / upgrade-way), so the stall IS
      w_victim_claimed.  Release at the conflicting entry's retire.
    status: covered
  - name: MshrSaturation
    level: full
    what: MSHR-pressure miss stream (ch06/02) with concurrent hits +
      snoops and merge pressure on alternate lines.  Pins the
      engine-paced plateau (>= min(K,4) live entries sustained; the
      single-outstanding fill engine paces allocs, so occupancy at
      MSHR_COUNT is literal only at the K=2/K=4 cells -- the wider file
      is burst headroom by design), the RTL occupancy gauge against the
      model, the mshr_full stall where the file fills, and J6
      backpressure at the wider cells.
    status: covered
  - name: MergeStorm
    level: full
    what: Merge storm (ch06/02): 2*MSHR_COUNT+2 read/write aliases onto
      one outstanding RU fill -- the merge list fills (mshr_full stall),
      the fill completing mid-storm freezes the list (commit_in_progress
      stall), post-commit aliases hit; every response scored by the
      event stream (a read observes exactly the writes that precede it).
    status: covered
  - name: SetOversubscription
    level: full
    what: Miss burst into ONE set (ch06/02) with merge pressure on the
      first fill.  Per-set live claims peak at min(WAYS, MSHR_COUNT)
      (exact at the min<=2 cells, floored at 3 elsewhere); the overflow
      stalls set_oversubscribed (or mshr_full when the file is the
      smaller resource) until a commit frees a claim.  The v4
      construction: scrub the set clean, hold fill 0 GLACIAL while the
      miss pair allocates and line 0's merge list fills (cap
      MSHR_COUNT), then FAST fills behind commit 0's merge lag (the
      stall window is L_commit0 > 2 fast fill times).  At K=4/WAYS=4
      the window is unreachable by construction (merge-cap-bounded lag
      ~19 cycles < the ~26-cycle requirement), so that cell pins the
      claim floor only; the stall itself is pinned at the K=2/WAYS=2
      cells, the unit TB, and the formal K=2 corner.
    status: covered
  - name: ComposedCorner
    level: full
    what: The composed corner reached dynamically (ch06/02): a
      write-biased miss stream over a tight set window with slow
      responders drives WB-full (VICTIM_DEPTH reached) with the MSHR
      file at its plateau while snoops rotate across WB lines (snarf),
      pending entries (bypass), and the arrays; simultaneous
      MSHR-full AND WB-full corner cycles are asserted at the K=2
      corner cell.
    status: covered
  - name: OracleLockstepSoak
    level: func+ (full = 10k: the amber FULL soak depth re-run on jet)
    what: Random read/write traffic over the bounded working set with
      random snoops (biased toward pending-fill lines) and responder
      profile switches; per-line coherence lockstep against the oracle
      throughout, 0 mismatches.
    status: covered
