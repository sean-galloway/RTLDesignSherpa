#==============================================================================
# bridge_ddr2_char_rd.toml
#==============================================================================
# 2-master x 1-slave AXI4 read bridge for the DDR2 characterization
# harness: the read half of the generator array, arbitrated down to pumice's
# single AXI4 slave port.
#
# WHY TWO BRIDGES INSTEAD OF ONE
# ------------------------------
# Read and write traffic are generated independently so the DIRECTION MIX is a
# knob. Read/write turnaround (tWTR, tRTW, bus turnaround) is paid at the DRAM
# and is invisible to any single-direction test, so the interesting shape of the
# curve is its middle -- and a single shared path cannot produce it, because
# there direction ratio and offered load are not separable. With the directions
# split, one can be held saturated while the other is swept in 5% steps.
#
# pumice's s_axi is one port with independent channel groups, so "two bridges"
# costs nothing at the controller: this bridge drives AR/R, its write sibling
# drives AW/W/B, and neither knows about the other.
#
# WHY TWO MASTERS (FIRST RUNG OF THE LADDER)
# ------------------------------------------
# The array exists to give the pumice controller genuine multi-master
# contention, which one stream never could. This build is the first rung: two
# masters per direction. It ladders to four next, and eight -- one per DRAM
# bank -- was the original intent but does not fit the XC7A100T (at 8+8 the
# harness synthesises to 66470 LUTs against 63400, and placement fails needing
# 13840 slices against 12371 available). Two per direction is deliberately
# below the fit ceiling: it proves the multi-master microarchitecture with the
# most headroom before the ladder climbs.
#
# Two concurrent streams already provoke bank concurrency and support the
# read/write mix sweep, which one stream could not. Each generator SPANS
# NUM_BANKS/NUM_GEN = 4 banks rather than owning one, so two of them keep all
# eight banks busy: the host spreads the two generators across the eight banks
# (stride NUM_BANKS/NUM_GEN) rather than leaving half the device idle, so
# bank-conflict behaviour is still exercised across the array.
#
# The flat ~12.7 MB/s board result was originally traced to the arbiter falling
# back to a single oldest bank (serialised ACT -> tRCD -> access) -- but a
# harness driving ONE address stream cannot tell that apart from a controller
# that refuses to go bank-parallel. Independently addressed masters make bank
# concurrency a property of the STIMULUS, so the measurement can distinguish the
# two.
#
# Nothing here forces master N onto bank N: the bank field's position is
# pumice's ADDR_MAP.bank_lsb and therefore runtime state. The host computes each
# generator's start address from the map it programmed, and asserts the mapping
# -- getting it wrong does not fail, it silently measures something else.
#
# Config for the generators themselves is NOT here. It lives in chargen_regs
# (ddr2_char_framework/rtl/chargen_regs.rdl) behind the chargen_apb slave of
# bridge_ddr2_char_axil at 0x000A0000.
#
# Generated outputs land in ddr2_char_framework/rtl/bridges/generated/bridge_ddr2_char_rd/.
#==============================================================================

[bridge]
name = "bridge_ddr2_char_rd"
description = "2x1 AXI4 read bridge -- read generators into pumice s_axi"
# Bring-up variant only. The monitored variant is available if the generator
# array ever needs per-master monbus observation, but the perf path here is
# PUMICE-016's external observer on the pumice interface, not per-master
# monitors inside the harness.
variants = ["no"]
mon_preset = "all"

[bridge.clock]
name = "aclk"
frequency_mhz = 100

# Skid depths carried from the bridge defaults. The R channel gets the deeper
# buffer because it is the one that has to stream a full burst back.
[bridge.defaults.skid_depths]
ar = 2
r = 4
aw = 2
w = 4
b = 2

# ---- Masters: two read generators, each spanning NUM_BANKS/2 banks ----------
[[bridge.masters]]
# Generator 0 -- by convention spans the low bank half; see the header.
name        = "rdgen0"
prefix      = "rdgen0_axi_"
protocol    = "axi4"
channels    = "rd"
id_width    = 8
addr_width  = 32
data_width  = 64
user_width  = 1

[[bridge.masters]]
# Generator 1 -- by convention spans the high bank half; see the header.
name        = "rdgen1"
prefix      = "rdgen1_axi_"
protocol    = "axi4"
channels    = "rd"
id_width    = 8
addr_width  = 32
data_width  = 64
user_width  = 1

# ---- Slave -----------------------------------------------------------------
[[bridge.slaves]]
# pumice's AXI4 slave port, AR/R channel group.
name        = "pumice_rd"
prefix      = "pumice_rd_axi_"
protocol    = "axi4"
channels    = "rd"
id_width    = 8
addr_width  = 32
data_width  = 64
user_width  = 1
base_addr   = "0x00000000"
# The whole part: 2^13 rows x 2^10 cols x 8 banks x 2 bytes (x16 device)
# = 128 MiB. One slave, so the decode is trivial -- the range is stated at the
# true device size rather than "big enough" so an address that walks off the
# end is a decode error here instead of an aliased access at the DRAM.
addr_range  = "0x08000000"
