#==============================================================================
# bridge_ddr2_char_wr.toml
#==============================================================================
# 4-master x 1-slave AXI4 write bridge for the DDR2 characterization
# harness: the write half of the per-bank generator array, arbitrated down to
# pumice's single AXI4 slave port.
#
# WHY TWO BRIDGES INSTEAD OF ONE
# ------------------------------
# Read and write traffic are generated independently so the DIRECTION MIX is a
# knob. Read/write turnaround (tWTR, tRTW, bus turnaround) is paid at the DRAM
# and is invisible to any single-direction test, so the interesting shape of the
# curve is its middle -- and a single shared path cannot produce it, because
# there direction ratio and offered load are not separable. With the directions
# split, one can be held saturated while the other is swept in 5% steps.
#
# pumice's s_axi is one port with independent channel groups, so "two bridges"
# costs nothing at the controller: this bridge drives AW/W/B, its read sibling
# drives AR/R, and neither knows about the other.
#
# WHY FOUR MASTERS, AND NOT EIGHT
# -------------------------------
# Eight -- one per DRAM bank -- was the intent and does not fit: at 8+8 the
# harness synthesises to 66470 LUTs against the XC7A100T's 63400, and placement
# fails needing 13840 slices against 12371 available. Four per direction fits
# with routing and timing margin.
#
# Four concurrent streams still provoke bank concurrency and still support the
# read/write mix sweep, which one stream never could; what is lost is having
# all eight banks busy at once. The host spreads the four generators across the
# eight banks (stride NUM_BANKS/NUM_GEN) rather than leaving half the device
# untouched, so bank-conflict behaviour is still exercised across the array.
#
# Originally, one generator per DRAM bank. The flat ~12.7 MB/s board result was traced to
# the arbiter falling back to a single oldest bank (serialised ACT -> tRCD ->
# access) -- but a harness driving ONE address stream cannot tell that apart
# from a controller that refuses to go bank-parallel. Eight independently
# addressed masters make bank concurrency a property of the STIMULUS, so the
# measurement can distinguish the two.
#
# Nothing here forces master N onto bank N: the bank field's position is
# pumice's ADDR_MAP.bank_lsb and therefore runtime state. The host computes each
# generator's start address from the map it programmed, and asserts the mapping
# -- getting it wrong does not fail, it silently measures something else.
#
# Config for the generators themselves is NOT here. It lives in chargen_regs
# (ddr2_char_framework/rtl/chargen_regs.rdl) behind the chargen_apb slave of
# bridge_ddr2_char_axil at 0x000A0000.
#
# Generated outputs land in ddr2_char_framework/rtl/bridges/generated/bridge_ddr2_char_wr/.
#==============================================================================

[bridge]
name = "bridge_ddr2_char_wr"
description = "4x1 AXI4 write bridge -- per-bank write generators into pumice s_axi"
# Bring-up variant only. The monitored variant is available if the generator
# array ever needs per-master monbus observation, but the perf path here is
# PUMICE-016's external observer on the pumice interface, not per-master
# monitors inside the harness.
variants = ["no"]
mon_preset = "all"

[bridge.clock]
name = "aclk"
frequency_mhz = 100

# Skid depths carried from the bridge defaults. The W channel gets the deeper
# buffer because it is the one that has to stream: the measured failure mode on
# this path was W beats never going back to back (max run length 1) while R
# sustained a full burst.
[bridge.defaults.skid_depths]
ar = 2
r = 4
aw = 2
w = 4
b = 2

# ---- Masters: one per DRAM bank --------------------------------------------
[[bridge.masters]]
# Generator 0 -- by convention drives DRAM bank 0; see the header.
name        = "wrgen0"
prefix      = "wrgen0_axi_"
protocol    = "axi4"
channels    = "wr"
id_width    = 8
addr_width  = 32
data_width  = 64
user_width  = 1

[[bridge.masters]]
# Generator 1 -- by convention drives DRAM bank 1; see the header.
name        = "wrgen1"
prefix      = "wrgen1_axi_"
protocol    = "axi4"
channels    = "wr"
id_width    = 8
addr_width  = 32
data_width  = 64
user_width  = 1

[[bridge.masters]]
# Generator 2 -- by convention drives DRAM bank 2; see the header.
name        = "wrgen2"
prefix      = "wrgen2_axi_"
protocol    = "axi4"
channels    = "wr"
id_width    = 8
addr_width  = 32
data_width  = 64
user_width  = 1

[[bridge.masters]]
# Generator 3 -- by convention drives DRAM bank 3; see the header.
name        = "wrgen3"
prefix      = "wrgen3_axi_"
protocol    = "axi4"
channels    = "wr"
id_width    = 8
addr_width  = 32
data_width  = 64
user_width  = 1

# ---- Slave -----------------------------------------------------------------
[[bridge.slaves]]
# pumice's AXI4 slave port, AW/W/B channel group.
name        = "pumice_wr"
prefix      = "pumice_wr_axi_"
protocol    = "axi4"
channels    = "wr"
id_width    = 8
addr_width  = 32
data_width  = 64
user_width  = 1
base_addr   = "0x00000000"
# The whole part: 2^13 rows x 2^10 cols x 8 banks x 2 bytes (x16 device)
# = 128 MiB. One slave, so the decode is trivial -- the range is stated at the
# true device size rather than "big enough" so an address that walks off the
# end is a decode error here instead of an aliased access at the DRAM.
addr_range  = "0x08000000"
