kind = "board"
rtl_roots = []
filelist_dirs = ["projects/fpga-systems/Genesys2/rapids_beats/flows-rapids-beats/filelists"]

# Byte-granular RAPIDS (rapids_top, rapids TASK-019) on the same bench: its own
