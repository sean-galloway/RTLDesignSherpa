# Central registry of every RTL filelist area in the repository.
#
# WHY THIS EXISTS
#   Filelists are the compile-closure contract: a consumer `-f` includes a
#   component's filelist and never hand-lists that component's sources. Before
#   this registry there was no way to answer "which modules lack a filelist?"
#   or "where do the lists live?" without hand-rolling a parser -- and every
#   hand-rolled parser got the path/env-var conventions subtly wrong.
#
#   Read this with bin/filelist_registry.py, which resolves `-f` includes and
#   the $*_ROOT variables exactly the way the cocotb consumer does
#   (bin/TBClasses/shared/filelist_utils.get_sources_from_filelist).
#
# GENERATED AREAS
#   Areas with `generated = true` have BOTH their RTL and their .f files emitted
#   by a generator. Never hand-edit them -- edit the config and re-run `regen`.
#   Hand edits are destroyed on the next regeneration, and a hand-edited .f for
#   a deleted generated dir is worse than useless: it looks maintained.
#
# ADDING AN AREA
#   Add an [[area]] block. `rtl_roots` are the trees the area owns (used for
#   coverage: every module declared there should be reachable from some .f).
#   Leave `rtl_roots` empty for consumer-only areas (boards, testbenches) that
#   own no library modules and only assemble other areas' filelists.

[registry]
version = 1
checker = "bin/filelist_registry.py"

# ---------------------------------------------------------------------------
# Shared RTL libraries -- these own modules and must have full coverage.
# ---------------------------------------------------------------------------

[[area]]
name = "common"
kind = "library"
rtl_roots = ["rtl/common"]
filelist_dirs = ["rtl/common/filelists"]

[[area]]
name = "math"
kind = "library"
# Split out of rtl/common: the math_* modules are a self-contained arithmetic
# library (adders, multipliers, bf16/fp16/fp32/fp8 formats) that rtl/common does
# not depend on except through explicit -f includes. Modules that merely USE
# arithmetic -- count_leading_zeros, find_first_set, mod_3_compress --
# deliberately stayed in common: they serve FIFOs and compressors, not math.
# (bin2gray/gray2bin were in that list until AMBA-CDC-REORG moved them to
# rtl/cdc, where the crossings that use them live.)
rtl_roots = ["rtl/math"]
filelist_dirs = ["rtl/math/filelists"]

[[area]]
name = "amba"
kind = "library"
rtl_roots = ["rtl/amba"]
filelist_dirs = ["rtl/amba/filelists"]

[[area]]
name = "misc"
kind = "component"
# Small shared oddments (dma_address_gen, simple_rom, axi4_slave_rom). It had no
# filelists and was unregistered until 2026-07-26, which is why --audit could not
# see that two rtl/amba/shared filelists were hand-listing dma_address_gen.sv:
# ownership comes from rtl_roots, and an unregistered area owns nothing.
rtl_roots = ["projects/components/misc/rtl"]
filelist_dirs = ["projects/components/misc/rtl/filelists"]

[[area]]
name = "cdc"
kind = "library"
# Pulled out of rtl/common and rtl/amba (AMBA-CDC-REORG): everything whose job
# is crossing a clock boundary lives here -- the handshakes, the synchronizer,
# the async FIFOs, and the Gray/Johnson coders that exist to make those
# crossings safe. glitch_free_n_dff_arn and sync_pulse joined them 2026-08-08:
# both are pure CDC primitives, and cdc modules already depended on the first,
# so the area used to reach BACK into rtl/common for its own core building
# block. Shared deps they merely USE (fifo_control, counter_bin) stay in their
# owning areas and are reached by -f include.
rtl_roots = ["rtl/cdc"]
filelist_dirs = ["rtl/cdc/filelists"]

# ---------------------------------------------------------------------------
# Components.
# ---------------------------------------------------------------------------

[[area]]
name = "bridge"
kind = "component"
generated = true
regen = "cd projects/components/bridge/bin && make regen"
rtl_roots = ["projects/components/bridge/rtl"]
# filelists/        -- emitted by bridge_generator.py; never hand-edit.
# filelists_static/ -- hand-written lists for the hand-written bridge RTL
#                      (bridge_cam), kept in a separate directory so a clean or
#                      regen of the generated half cannot delete them.
filelist_dirs = [
    "projects/components/bridge/rtl/filelists",
    "projects/components/bridge/rtl/filelists_static",
]

[[area]]
name = "converters"
kind = "component"
rtl_roots = ["projects/components/converters/rtl"]
filelist_dirs = ["projects/components/converters/rtl/filelists"]

[[area]]
name = "stream"
kind = "component"
rtl_roots = ["projects/components/dmas/stream/rtl"]
filelist_dirs = ["projects/components/dmas/stream/rtl/filelists"]

[[area]]
name = "rapids"
kind = "component"
rtl_roots = ["projects/components/dmas/rapids/rtl"]
filelist_dirs = ["projects/components/dmas/rapids/rtl/filelists"]

[[area]]
name = "retro_legacy_blocks"
kind = "component"
rtl_roots = ["projects/components/retro_legacy_blocks/rtl"]
filelist_dirs = ["projects/components/retro_legacy_blocks/rtl"]

[[area]]
name = "apbx_xbar"
kind = "component"
rtl_roots = ["projects/components/apbx-xbar/rtl"]
filelist_dirs = ["projects/components/apbx-xbar/rtl/filelists"]

[[area]]
name = "pumice"
kind = "component"
rtl_roots = ["projects/components/memory-controllers/pumice-ddr2-lpddr2/rtl"]
filelist_dirs = [
    "projects/components/memory-controllers/pumice-ddr2-lpddr2/rtl/filelists",
    # DV tb_top assemblies (consumer-only: -f the component filelists + tb files)
    "projects/components/memory-controllers/pumice-ddr2-lpddr2/dv/tb",
]

# ---------------------------------------------------------------------------
# Board / characterization projects. These own little or no library RTL; they
# assemble the areas above. Coverage is not enforced, but the no-hand-listing
# rule still is.
# ---------------------------------------------------------------------------

