filelist_dirs = ["projects/fpga-systems/NexysA7/pumice/ddr2_char_framework/rtl/bridges/filelists"]

[[area]]
name = "nexys_reed_solomon_bridges"
kind = "board"
generated = true
regen = "projects/fpga-systems/NexysA7/reed-solomon/bin/regen_bridges.sh"
# The 1x3 AXIL fabric the loop harness drives (host -> loop regs + two
# reserved windows). Its own area, like the ddr2-char and stream bridges,
# because the RTL is generated and the regen script is the authority.
rtl_roots = []
filelist_dirs = ["projects/fpga-systems/NexysA7/reed-solomon/rtl/bridges/filelists"]

[[area]]
name = "genesys2_stream_bridges"
kind = "board"
generated = true
regen = "projects/fpga-systems/Genesys2/stream/bin/regen_bridges.sh"
rtl_roots = []
filelist_dirs = ["projects/fpga-systems/Genesys2/stream/rtl/bridges/filelists"]

[[area]]
name = "genesys2_stream"
kind = "board"
rtl_roots = []
filelist_dirs = ["projects/fpga-systems/Genesys2/stream/rtl/filelists"]

# REMOVED 2026-08-30: the two "nexys_stream_char" areas registered
# projects/NexysA7/stream_characterization, which is being deleted. Their
# successors are already registered above -- "genesys2_stream_bridges" and
# "genesys2_stream" -- and the perf scripts, report datasets and the
# stream_char_guide doc book were consolidated into
# projects/fpga-systems/Genesys2/stream/ before removal.
#
# nexys_stream_char was already FAILING --check with 2 broken refs, so this
# also retires a known-bad entry rather than a working one. The DDR2 areas
# (nexys_ddr2_char*) point at a DIFFERENT NexysA7 project and stay.

# The memory-characterization framework, shared across boards. Promoted out of
# NexysA7/pumice/ddr2_char_framework on 2026-09-30: the engine was already
# advertised as DUT-agnostic but lived under one controller's board directory
# and imported that controller's package, so a DDR3 harness could not use it and
# the LiteDRAM yardstick build compiled the whole DDR2 controller it was meant
# to be measured against. Both pumice (Nexys A7) and scoria (Genesys 2) pull
# rtl/filelists/char_engine_block.f from here.
[[area]]
name = "mem_char_framework"
kind = "board"
rtl_roots = []
filelist_dirs = ["projects/fpga-systems/rtl/mem_char_framework/rtl/filelists"]

[[area]]
name = "nexys_ddr2_char"
kind = "board"
rtl_roots = []
filelist_dirs = [
    "projects/fpga-systems/NexysA7/pumice/ddr2_char_framework/dv/filelists",
    "projects/fpga-systems/NexysA7/pumice/build-perf/rtl/filelists",
    "projects/fpga-systems/NexysA7/pumice/ddr2-characterization/flows-litedram-uart/rtl/filelists",
    "projects/fpga-systems/NexysA7/pumice/ddr2_char_framework/rtl/filelists",
]

# scoria on the Genesys 2. Two builds by design -- scoria on real DDR3 and
# LiteDRAM in its place -- so a bandwidth number has a yardstick taken on the
# same board, same pins, same char engine.
[[area]]
name = "genesys2_scoria"
kind = "board"
rtl_roots = []
filelist_dirs = [
    "projects/fpga-systems/Genesys2/scoria/build-litedram/rtl/filelists",
    "projects/fpga-systems/Genesys2/scoria/rtl/filelists",
    # The generated config bridge's list. Registered for the reason the
    # registry exists: a broken `-f` in a generated filelist is otherwise
    # found by the Vivado run that fails to elaborate, 90 seconds in.
    "projects/fpga-systems/Genesys2/scoria/rtl/bridges/filelists",
    # The scoria board build, the A-side of the A/B. Two lists: the synthesis
    # closure and a lint variant that swaps the generated PHY for a blackbox
    # stub and adds the Xilinx primitive stubs.
    "projects/fpga-systems/Genesys2/scoria/build-scoria/rtl/filelists",
]

[[area]]
