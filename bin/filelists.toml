# ---------------------------------------------------------------------------
# Coverage exemptions: modules that intentionally have no filelist reaching
# them. Every entry needs a reason -- an unexplained exemption is a silent gap.
# ---------------------------------------------------------------------------

[exempt]

# arbiter_single_client: verified one level up, in STREAM
# (projects/components/dma-ip/stream/rtl/macro/scheduler_group_array.sv:434
# is its only instantiation anywhere). No val/common test is wanted --
# Sean, 2026-08-07 -- so it will never appear in this area's line-coverage
# denominator, and that absence is a decision rather than a gap.

# Two-stage bank scheduler (per-bank pickers + tournament core). Correct and
# fully verified, but 2.3x the flat arbiter's LUTs -> 97% slices -> route
# congestion; does not fit the xc7a100t -1. Set aside as the base returns to the
# flat single-stage FR-FCFS arbiter, and preserved for the codegen family
# (enable on a bigger/faster part). See rtl/OLD/README.md.
pumice_bank_cmd_picker = "set aside under rtl/OLD/ -- two-stage scheduler, too big for this part; see that README"
pumice_bank_sched_core = "set aside under rtl/OLD/ -- two-stage scheduler, too big for this part; see that README"
