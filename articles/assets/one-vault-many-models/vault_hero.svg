<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">One vault, many models</title>
  <desc id="desc">Four coding-agent cards, Claude, Kimi, Qwen and Nemotron, feed one vault holding three drawers: handbook, tracking and repo-wide projects. Matching cyan and gold lines leave the vault toward RTL, tests and docs.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050D18"/>
      <stop offset="0.55" stop-color="#0A1B2D"/>
      <stop offset="1" stop-color="#102A3B"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#29D3E2" stop-opacity="0.20"/>
      <stop offset="0.65" stop-color="#29D3E2" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#29D3E2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#173B52"/>
      <stop offset="1" stop-color="#0B1E31"/>
    </linearGradient>
    <linearGradient id="streamCyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#42E8F5" stop-opacity="0.95"/>
      <stop offset="0.65" stop-color="#42E8F5" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#42E8F5" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="streamGold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFCB6B" stop-opacity="0.95"/>
      <stop offset="0.65" stop-color="#FFCB6B" stop-opacity="0.50"/>
      <stop offset="1" stop-color="#FFCB6B" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#91C7D8" stroke-opacity="0.045"/>
      <circle cx="0" cy="0" r="1.4" fill="#91C7D8" fill-opacity="0.08"/>
    </pattern>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000712" flood-opacity="0.55"/>
    </filter>
    <filter id="lineGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#42E8F5"/>
    </marker>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#FFCB6B"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <ellipse cx="800" cy="520" rx="680" ry="390" fill="url(#glow)"/>

  <g font-family="Inter, Helvetica, Arial, sans-serif">
    <text x="92" y="102" fill="#74A9BA" font-size="15" font-weight="600" letter-spacing="5">REPO MEMORY</text>
    <text x="88" y="180" fill="#F2FAFC" font-size="76" font-weight="700" letter-spacing="3">THE VAULT</text>
    <text x="94" y="225" fill="#B6D2DC" font-size="25" letter-spacing="0.4">Four models. One way of doing things.</text>
    <path d="M96 253H330" stroke="#FFCB6B" stroke-width="3"/>
    <path d="M342 253H394" stroke="#42E8F5" stroke-width="3"/>
  </g>

  <!-- model cards -->
  <g font-family="Inter, Helvetica, Arial, sans-serif" filter="url(#shadow)">
    <text x="112" y="330" fill="#74A9BA" font-size="13" font-weight="600" letter-spacing="3">FOUR CODING AGENTS</text>
    <g transform="rotate(-3 240 395)">
      <rect x="108" y="352" width="270" height="86" rx="12" fill="#102B40" stroke="#4B7B90" stroke-width="2"/>
      <rect x="108" y="352" width="9" height="86" rx="4.5" fill="#FFCB6B"/>
      <text x="138" y="390" fill="#F2FAFC" font-size="24" font-weight="700">CLAUDE</text>
      <text x="138" y="416" fill="#FFCB6B" font-size="12" font-weight="600" letter-spacing="1.5">CLAUDE CODE HARNESS</text>
    </g>
    <g transform="rotate(2 260 500)">
      <rect x="128" y="458" width="270" height="86" rx="12" fill="#102B40" stroke="#4B7B90" stroke-width="2"/>
      <rect x="128" y="458" width="9" height="86" rx="4.5" fill="#42E8F5"/>
      <text x="158" y="496" fill="#F2FAFC" font-size="24" font-weight="700">KIMI</text>
      <text x="158" y="522" fill="#42E8F5" font-size="12" font-weight="600" letter-spacing="1.5">KIMI CODE HARNESS</text>
    </g>
    <g transform="rotate(-2 240 605)">
      <rect x="108" y="564" width="270" height="86" rx="12" fill="#102B40" stroke="#4B7B90" stroke-width="2"/>
      <rect x="108" y="564" width="9" height="86" rx="4.5" fill="#FFCB6B"/>
      <text x="138" y="602" fill="#F2FAFC" font-size="24" font-weight="700">QWEN</text>
      <text x="138" y="628" fill="#FFCB6B" font-size="12" font-weight="600" letter-spacing="1.5">RUNS LOCALLY</text>
    </g>
    <g transform="rotate(3 260 712)">
      <rect x="128" y="670" width="270" height="86" rx="12" fill="#102B40" stroke="#4B7B90" stroke-width="2"/>
      <rect x="128" y="670" width="9" height="86" rx="4.5" fill="#42E8F5"/>
      <text x="158" y="708" fill="#F2FAFC" font-size="24" font-weight="700">NEMOTRON</text>
      <text x="158" y="734" fill="#42E8F5" font-size="12" font-weight="600" letter-spacing="1.5">RUNS LOCALLY</text>
    </g>
  </g>

  <!-- feeds into vault -->
  <g fill="none" stroke-linecap="round" stroke-width="3" stroke-opacity="0.75">
    <path d="M382 392C500 392 540 440 618 452" stroke="#FFCB6B" marker-end="url(#arrowGold)"/>
    <path d="M402 500C500 500 540 500 618 500" stroke="#42E8F5" marker-end="url(#arrowCyan)"/>
    <path d="M382 606C500 606 540 556 618 548" stroke="#FFCB6B" marker-end="url(#arrowGold)"/>
    <path d="M402 714C510 714 545 610 618 596" stroke="#42E8F5" marker-end="url(#arrowCyan)"/>
  </g>
  <text x="470" y="372" fill="#9CC6D3" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" letter-spacing="2">SAME NOTES</text>

  <!-- vault -->
  <g font-family="Inter, Helvetica, Arial, sans-serif" filter="url(#shadow)">
    <g stroke="#3B8297" stroke-width="4" stroke-linecap="round">
      <path d="M620 452H650M620 500H650M620 548H650M620 596H650"/>
      <path d="M950 430H980M950 506H980M950 582H980M950 650H980"/>
    </g>
    <rect x="650" y="330" width="300" height="370" rx="24" fill="url(#chip)" stroke="#67D9E7" stroke-width="2.5"/>
    <rect x="667" y="347" width="266" height="336" rx="16" fill="none" stroke="#6EA4B7" stroke-opacity="0.25"/>
    <circle cx="800" cy="372" r="4" fill="#FFCB6B" filter="url(#lineGlow)"/>
    <text x="800" y="420" text-anchor="middle" fill="#F3FCFE" font-size="34" font-weight="700" letter-spacing="2">VAULT</text>
    <!-- drawers -->
    <rect x="690" y="450" width="220" height="56" rx="10" fill="#0E2638" stroke="#FFCB6B" stroke-opacity="0.8" stroke-width="1.6"/>
    <text x="712" y="476" fill="#F2FAFC" font-size="16" font-weight="700" letter-spacing="1.5">HANDBOOK</text>
    <text x="712" y="495" fill="#FFCB6B" font-size="11" font-weight="600" letter-spacing="1.5">METHOD</text>
    <rect x="886" y="472" width="10" height="12" rx="3" fill="#FFCB6B" opacity="0.8"/>
    <rect x="690" y="518" width="220" height="56" rx="10" fill="#0E2638" stroke="#42E8F5" stroke-opacity="0.8" stroke-width="1.6"/>
    <text x="712" y="544" fill="#F2FAFC" font-size="16" font-weight="700" letter-spacing="1.5">TRACKING</text>
    <text x="712" y="563" fill="#42E8F5" font-size="11" font-weight="600" letter-spacing="1.5">WORK</text>
    <rect x="886" y="540" width="10" height="12" rx="3" fill="#42E8F5" opacity="0.8"/>
    <rect x="690" y="586" width="220" height="56" rx="10" fill="#0E2638" stroke="#6B91A5" stroke-opacity="0.9" stroke-width="1.6"/>
    <text x="712" y="612" fill="#F2FAFC" font-size="16" font-weight="700" letter-spacing="1.5">PROJECTS</text>
    <text x="712" y="631" fill="#9CC6D3" font-size="11" font-weight="600" letter-spacing="1.5">CONTEXT</text>
    <rect x="886" y="608" width="10" height="12" rx="3" fill="#6B91A5" opacity="0.9"/>
    <path d="M718 666H882" stroke="#42E8F5" stroke-width="5" stroke-linecap="round" opacity="0.55"/>
  </g>

  <!-- outputs -->
  <g font-family="Inter, Helvetica, Arial, sans-serif">
    <text x="1080" y="330" fill="#74A9BA" font-size="13" font-weight="600" letter-spacing="3">ONE ANSWER, EVERY SESSION</text>
  </g>
  <g fill="none" stroke-linecap="round">
    <path d="M978 430C1130 400 1290 400 1500 370" stroke="url(#streamGold)" stroke-width="5" marker-end="url(#arrowGold)"/>
    <path d="M978 506C1160 495 1320 500 1520 490" stroke="url(#streamCyan)" stroke-width="5" marker-end="url(#arrowCyan)"/>
    <path d="M978 582C1160 595 1330 600 1510 625" stroke="url(#streamGold)" stroke-width="5" marker-end="url(#arrowGold)"/>
    <path d="M978 650C1150 690 1320 700 1500 740" stroke="url(#streamCyan)" stroke-width="4" stroke-opacity="0.65"/>
  </g>
  <g filter="url(#lineGlow)">
    <rect x="1150" y="402" width="58" height="12" rx="6" fill="#FFE0A0" transform="rotate(-4 1150 402)"/>
    <rect x="1280" y="494" width="62" height="12" rx="6" fill="#8CF4FC" transform="rotate(-1 1280 494)"/>
    <rect x="1200" y="590" width="58" height="12" rx="6" fill="#FFE0A0" transform="rotate(2 1200 590)"/>
  </g>
  <g font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="2" fill="#9CC6D3">
    <text x="1380" y="366">RTL</text>
    <text x="1380" y="476">TESTS</text>
    <text x="1380" y="596">DOCS</text>
    <text x="1350" y="690">TRACKER</text>
  </g>

  <g font-family="Inter, Helvetica, Arial, sans-serif">
    <text x="96" y="842" fill="#6F9AAA" font-size="13" font-weight="600" letter-spacing="3">METHOD  /  WORK  /  CONTEXT</text>
    <text x="1504" y="842" text-anchor="end" fill="#6F9AAA" font-size="13" letter-spacing="2">RTL DESIGN SHERPA</text>
  </g>
</svg>
